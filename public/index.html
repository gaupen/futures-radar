        // ==================== 定时器控制（交易时段对齐） ====================
        // 规则很简单：交易中就按设定频率轮询；休市就彻底停手，只在开盘前 10 分钟醒一次。
        // 不再有"把间隔悄悄拉长到 300s"这种假刷新——没有新数据时刷新毫无意义。
        function currentScanInterval() {
            if (scanIntervalSec <= 0) return 0;
            if (!isTradingNow()) return 0;                 // 休市不轮询
            return dataMode === 'live' ? scanIntervalSec : Math.min(scanIntervalSec * 2, 120);
        }
        function focusPollIntervalSec() {
            if (focusPollSec <= 0) return 0;
            if (!isTradingNow()) return 0;
            return dataMode === 'live' ? focusPollSec : Math.min(focusPollSec * 3, 30);
        }

        // 休市时的"一次性唤醒"定时器
        let idleTimer = null;
        let idleUiTimer = null;    // 休市期间仅刷新横幅文字的慢钟（60s，零网络请求）

        // 决定当前该"轮询"还是"睡觉"
        function applyRefreshSchedule() {
            if (idleTimer) { clearTimeout(idleTimer); idleTimer = null; }
            if (idleUiTimer) { clearInterval(idleUiTimer); idleUiTimer = null; }
            const next = nextRefreshAt();
            if (next) {
                stopAllTimers();                       // 休市：一个网络定时器都不留
                const delay = Math.max(1000, next.getTime() - Date.now());
                idleTimer = setTimeout(() => {
                    idleTimer = null;
                    scanFullMarket(false);
                }, delay);
                // 只为了让"还有 X 小时"这句文案保持准确，不发任何请求
                idleUiTimer = setInterval(() => {
                    updateCountdownUI();
                    updateDataSourceBanner();
                }, 60000);
                updateCountdownUI();
                updateDataSourceBanner();
                return;
            }
            startAllTimers();
        }


        function startAllTimers() {
            stopAllTimers();
            if (!isTradingNow()) { updateCountdownUI(); return; }   // 双保险：休市绝不起轮询
            countdownRemaining = currentScanInterval();

            // 1. 每秒更新倒计时进度条 (纯 UI, 无网络)
            countdownTimer = setInterval(() => {
                if (activeModalSecId || scanIntervalSec <= 0) return;
                if (!isTradingNow()) { applyRefreshSchedule(); return; }  // 跨过收盘点立即转休眠
                countdownRemaining--;
                if (countdownRemaining <= 0) {
                    scanFullMarket(false);
                    countdownRemaining = currentScanInterval();
                }
                updateCountdownUI();
            }, 1000);

            // 2. 焦点池自调度轮询：每次按当前数据模式动态决定间隔，实时时快、空窗时自动降到 ≤60s
            function scheduleFocusPoll() {
                if (scanIntervalSec <= 0) return;
                const intervalMs = Math.max(1000, focusPollIntervalSec() * 1000);
                focusPollTimer = setTimeout(() => {
                    if (!isTradingNow()) { applyRefreshSchedule(); return; }  // 同样：收盘即停
                    if (!document.hidden && !activeModalSecId && isStep1Ready && focusQuotes.length > 0) {
                        refreshFocusPoolPrices();
                    }
                    if (!document.hidden) scheduleFocusPoll();
                }, intervalMs);
            }
            scheduleFocusPoll();
        }

        function stopAllTimers() {
            if (countdownTimer) { clearInterval(countdownTimer); countdownTimer = null; }
            if (focusPollTimer) { clearTimeout(focusPollTimer); clearInterval(focusPollTimer); focusPollTimer = null; }
            if (idleUiTimer) { clearInterval(idleUiTimer); idleUiTimer = null; }
        }

        function updateCountdownUI() {
            const textEl = document.getElementById('countdown-status-text');
            const progressEl = document.getElementById('countdown-progress-bar');
            const timerDot = document.getElementById('compact-timer-dot');
            const timerText = document.getElementById('compact-timer-text');

            // 休市：明确告诉用户"不发请求、几时醒"，而不是继续假装倒计时
            if (!isTradingNow()) {
                const hint = idleHintText();
                if (textEl) textEl.textContent = hint ? `🌙 休市 · 已停止请求 · ${hint}` : '🌙 休市 · 已停止请求';
                if (progressEl) progressEl.style.width = '0%';
                if (timerDot) timerDot.textContent = '🌙';
                if (timerText) timerText.textContent = '休市';
                document.querySelectorAll('.progress-node-pin').forEach(p => {
                    if (!p.classList.contains('flash')) p.className = 'progress-node-pin eaten';
                });
                return;
            }

            if (scanIntervalSec <= 0) {
                if (textEl) textEl.textContent = `⏸️ 已暂停自动全盘重扫 | 焦点池 ${focusPollSec}秒 轮询中`;
                if (progressEl) progressEl.style.width = '100%';
                if (timerDot) timerDot.textContent = '⏸️';
                if (timerText) timerText.textContent = '已暂停';
                return;
            }

            const pct = Math.max(0, Math.min(100, (countdownRemaining / scanIntervalSec) * 100));
            if (textEl) {
                textEl.textContent = `⚡ 距第1级全盘雷达重扫还有 ${countdownRemaining} 秒`;
            }
            if (progressEl) {
                progressEl.style.width = `${pct}%`;
            }
            if (timerDot) {
                timerDot.textContent = '🟢';
            }
            if (timerText) {
                timerText.textContent = `${countdownRemaining}s`;
            }

            // 更新打点节点活跃/已吃状态 (保留正在 flash 的高光)
            const totalNodes = Math.floor(scanIntervalSec / focusPollSec);
            for (let i = 1; i < totalNodes; i++) {
                const pin = document.getElementById(`node-pin-${i}`);
                if (pin && !pin.classList.contains('flash')) {
                    const nodePct = (i * focusPollSec / scanIntervalSec) * 100;
                    pin.className = (nodePct <= pct) ? 'progress-node-pin active' : 'progress-node-pin eaten';
                }
            }
        }

        // ==================== 批量抓取：合约池 → ulist 分批 ====================
        // 单批 150 个 secid（实测 200 亦可，留余量避免 URL 过长被网关截断）
        const ULIST_BATCH = 150;
        const ULIST_FIELDS = 'f12,f13,f14,f2,f3,f4,f5,f6,f15,f16,f17,f18,f124';
        const ULIST_UT = 'bd1d9ddb04089700cf9c27f6f7426281';
        // 东财有多个行情网关，同一个 IP 被某个网关限流时换一个往往就能通
        const ULIST_HOSTS = ['push2.eastmoney.com', '82.push2.eastmoney.com', 'push2delay.eastmoney.com'];
        let lastBatchStat = { batches: 0, okBatches: 0, got: 0 };
        let focusPollTries = 0;   // 焦点池每轮换一个网关，避免长期打在同一个被限流的 host 上

        function ulistUrl(secids, hostIdx) {
            const host = ULIST_HOSTS[(hostIdx || 0) % ULIST_HOSTS.length];
            return 'https://' + host + '/api/qt/ulist.np/get?secids=' + secids
                + '&fltt=2&invt=2&fields=' + ULIST_FIELDS + '&ut=' + ULIST_UT + '&_t=' + Date.now();
        }

        // 通用东财 JSONP 加载器：用 <script> 加载，天生不受 CORS 约束。
        // 事实依据：无浏览器环境下 ulist 能取到完整收盘，但浏览器 fetch 被 CORS 拦成 0/N；
        // 而东财 push2 系列支持 cb= 回调（实测返回 testcb({...});）。脚本标签不校验 ACAO，可绕过。
        function loadEmJsonp(baseUrl, timeoutMs) {
            return new Promise((resolve, reject) => {
                const cbName = '__em_cb_' + Date.now() + '_' + Math.floor(Math.random() * 100000);
                const script = document.createElement('script');
                const sep = baseUrl.indexOf('?') >= 0 ? '&' : '?';
                let settled = false;
                const timer = setTimeout(() => finish(null, new Error('jsonp timeout')), timeoutMs || 6000);
                function finish(data, err) {
                    if (settled) return;
                    settled = true;
                    clearTimeout(timer);
                    try { delete window[cbName]; } catch (e) { window[cbName] = undefined; }
                    if (script.parentNode) script.parentNode.removeChild(script);
                    if (err) reject(err); else resolve(data);
                }
                window[cbName] = function (data) { finish(data, null); };
                script.onerror = function () { finish(null, new Error('jsonp script error')); };
                script.src = baseUrl + sep + 'cb=' + cbName;
                document.head.appendChild(script);
            });
        }

        // 拉取给定 secid 的报价；返回原始 diff 数组。任一批次失败不影响其余批次。
        // 东财对同一 IP 有频控，且浏览器 fetch 会被 CORS 拦截 → 每批先走 JSONP，失败再退 fetch。
        const sleep = ms => new Promise(r => setTimeout(r, ms));

        async function fetchSingleBatch(chunk, ci) {
            let lastErr = '';
            for (let attempt = 0; attempt < 2; attempt++) {
                if (attempt > 0) await sleep(150);
                const url = ulistUrl(chunk.join(','), ci * 3 + attempt);
                // ① JSONP 优先（绕过浏览器 CORS，实测 ~30-70ms 极速响应）
                try {
                    const json = await loadEmJsonp(url, 3000);
                    const diff = (json && json.data && Array.isArray(json.data.diff)) ? json.data.diff : [];
                    if (diff.length) return diff;
                    lastErr = 'jsonp 返回空';
                } catch (e) { lastErr = 'jsonp: ' + ((e && e.message) || e); }
                // ② fetch 兜底（带 1500ms 超时中断）
                try {
                    const ctrl = new AbortController();
                    const tid = setTimeout(() => ctrl.abort(), 1500);
                    const resp = await fetch(url, { cache: 'no-store', signal: ctrl.signal });
                    clearTimeout(tid);
                    const json = await resp.json();
                    const diff = (json && json.data && Array.isArray(json.data.diff)) ? json.data.diff : [];
                    if (diff.length) return diff;
                    lastErr = 'fetch 返回空';
                } catch (e) { lastErr = 'fetch: ' + ((e && e.message) || e); }
            }
            console.warn('[ulist] batch ' + (ci + 1) + ' 失败：' + lastErr);
            return [];
        }

        async function fetchQuotesBySecids(secids) {
            const chunks = [];
            for (let i = 0; i < secids.length; i += ULIST_BATCH) chunks.push(secids.slice(i, i + ULIST_BATCH));

            // 并发拉取所有批次：从过去的串行数秒直接提速至 ~150-250ms 全量完成
            const promises = chunks.map((chunk, ci) => fetchSingleBatch(chunk, ci));
            const results = await Promise.allSettled(promises);

            const out = [];
            let okBatches = 0;
            results.forEach((res) => {
                if (res.status === 'fulfilled' && Array.isArray(res.value) && res.value.length) {
                    okBatches++;
                    res.value.forEach(d => out.push(d));
                }
            });

            lastBatchStat = { batches: chunks.length, okBatches: okBatches, got: out.length };
            console.log('[ulist] 并发批次统计', lastBatchStat);
            return out;
        }

        // 东财 clist 全市场列表接口（备用快速兜底）：
        // 抓取多头涨幅榜 (po=1) 与 空头跌幅榜 (po=0)，合并去重
        const CLIST_FS = 'm:113,m:114,m:115,m:220,m:142,m:225';
        const CLIST_HOSTS = ['https://82.push2.eastmoney.com', 'https://push2.eastmoney.com'];
        async function fetchQuotesViaClist() {
            let lastErr = null;
            for (const host of CLIST_HOSTS) {
                const makeUrl = (po) => host + '/api/qt/clist/get'
                    + '?pn=1&pz=100&po=' + po + '&np=1&fltt=2&invt=2&fid=f3'
                    + '&fs=' + CLIST_FS
                    + '&fields=' + ULIST_FIELDS
                    + '&ut=' + ULIST_UT + '&_t=' + Date.now();
                try {
                    const ctrl = new AbortController();
                    const tid = setTimeout(() => ctrl.abort(), 1500);
                    const respUp = await fetch(makeUrl(1), { cache: 'no-store', signal: ctrl.signal });
                    const jsonUp = respUp.ok ? await respUp.json() : null;

                    const respDown = await fetch(makeUrl(0), { cache: 'no-store', signal: ctrl.signal });
                    const jsonDown = respDown.ok ? await respDown.json() : null;
                    clearTimeout(tid);

                    const diffUp = (jsonUp && jsonUp.data && Array.isArray(jsonUp.data.diff)) ? jsonUp.data.diff : [];
                    const diffDown = (jsonDown && jsonDown.data && Array.isArray(jsonDown.data.diff)) ? jsonDown.data.diff : [];

                    const map = new Map();
                    [...diffUp, ...diffDown].forEach(item => {
                        if (item && item.f12) {
                            const secid = `${item.f13}.${item.f12}`;
                            map.set(secid, item);
                        }
                    });
                    const combined = Array.from(map.values());
                    if (combined.length) {
                        console.log(`[clist] 从 ${host} 拿到 ${combined.length} 条 (多空双向全覆盖)`);
                        return combined;
                    }
                } catch (e) {
                    lastErr = e;
                }
            }
            console.warn('[clist] 快速检测不可用：' + ((lastErr && lastErr.message) || lastErr));
            return [];
        }

        // ==================== 云端收盘快照（Cloudflare Worker Cron + KV） ====================
        // Worker 每天 15:05 / 23:35 / 02:35（北京时间）用 Cron 自动抓一次东财全市场并存入 KV；
        // 页面休市打开时先读 /api/snapshot，命中即直接渲染，一个东财请求都不发（避免收盘后抓不到）。
        // 仅服务端独占定时抓取与落库，前端纯只读，杜绝客户端脏快照污染。
        const SNAP_MAX_AGE_MS = 48 * 3600 * 1000;   // 快照超过 48 小时视为过期，不用

        async function fetchCloudSnapshot() {
            try {
                const resp = await fetch('/api/snapshot', { cache: 'no-store' });
                if (!resp.ok) return null;
                const json = await resp.json();
                if (!json || !Array.isArray(json.diff) || !json.diff.length) return null;
                return json;
            } catch (e) { return null; }
        }

        // ==================== 第一步：全市场雷达初筛（合约池 + 批量，不依赖列表接口） ====================
        // 原实现用 clist 列表接口（一次拿全市场）。该接口在非交易时段/限流时返回空甚至直接断连，
        // 于是界面白屏、且被误判成"非交易时段无数据"。现改为自建合约池 + ulist 批量：
        // 实测 ulist 在凌晨休市时依然返回完整收盘（燃油2612 -5.99% 可复现），无需任何快照搬运。
        // —— 但浏览器 fetch/JSONP 可能被 CORS / 外壳 CSP / 拦截插件掐断，故东财拿不到时自动降级到新浪日线。

        // 新浪兜底：东财不可用时，逐合约取日线（getDailyKLine），用最近两日收盘算涨跌幅。
        // 新浪 JSONP 在用户环境已验证可用（K 线图即走新浪），是最稳的兜底源。
        // 新浪 symbol = 合约代码大写（如 fu2612 → FU2612）；成交量为日线 v 字段（手）。
        async function scanViaSina(pool) {
            const out = [];
            const CONC = 8; // 并发上限，避免一次性塞几百个 <script>
            let idx = 0;
            async function worker() {
                while (idx < pool.length) {
                    const item = pool[idx++];
                    try {
                        const sym = (item.code || '').toUpperCase();
                        if (!sym) continue;
                        const url = 'https://stock2.finance.sina.com.cn/futures/api/jsonp.php/var%20CALLBACK_VAR=/InnerFuturesNewService.getDailyKLine?symbol=' + sym;
                        const bars = await loadSinaFuturesJsonp(url);
                        if (Array.isArray(bars) && bars.length >= 2) {
                            const last = bars[bars.length - 1];
                            const prev = bars[bars.length - 2];
                            const price = parseFloat(last.c) || 0;
                            const prevClose = parseFloat(prev.c) || 0;
                            const change = price - prevClose;
                            const changePercent = prevClose ? (change / prevClose) * 100 : 0;
                            const vol = parseInt(last.v) || 0;
                            const isLiquid = (vol >= currentVolThreshold);
                            if (price > 0 && (isLiquid || isFavorite(item.secid, item.code))) {
                                out.push({
                                    secid: item.secid, code: item.code, market: item.market, name: sym,
                                    price: price, changePercent: changePercent, change: change,
                                    vol: vol, amount: 0,
                                    high: parseFloat(last.h) || 0, low: parseFloat(last.l) || 0,
                                    open: parseFloat(last.o) || 0, prevSettle: prevClose,
                                    tradeTime: 0,
                                    isLiquid: isLiquid
                                });
                            }
                        }
                    } catch (e) {}
                }
            }
            const ws = [];
            for (let i = 0; i < CONC; i++) ws.push(worker());
            await Promise.all(ws);
            return out;
        }

        // 把东财原始 diff（clist / KV 快照同结构）转成页面用的 quote 列表。
        // 实时抓取与读取云端快照共用此函数，确保两路口径一致（阈值改动也即时生效）。
        function buildQuoteMapFromRaw(rawList) {
            const quoteMap = {};
            (rawList || []).forEach(item => {
                const secid = `${item.f13}.${item.f12}`;
                if (!quoteMap[secid] && item.f2 && item.f2 !== '-') {
                    const name = item.f14 || '';
                    const code = item.f12 || '';
                    const vol = parseInt(item.f5) || 0;
                    const amount = parseFloat(item.f6) || 0;

                    const tradeTime = item.f124 ? parseInt(item.f124, 10) * 1000 : 0;

                    // 1. 物理合约过滤：必须带具体年份月份，杜绝主连/主力/指数/当月/临近交割
                    if (!isPhysicalContract(name, code)) return;

                    // 2. 成交量硬过滤（含自选豁免）
                    const isLiquid = (vol >= currentVolThreshold);
                    if (!isLiquid && !isFavorite(secid, code)) return;

                    quoteMap[secid] = {
                        secid: secid,
                        code: item.f12,
                        market: item.f13,
                        name: name,
                        price: parseFloat(item.f2) || 0,
                        changePercent: parseFloat(item.f3) || 0,
                        change: parseFloat(item.f4) || 0,
                        vol: vol,
                        amount: amount,
                        high: parseFloat(item.f15) || 0,
                        low: parseFloat(item.f16) || 0,
                        open: parseFloat(item.f17) || 0,
                        prevSettle: parseFloat(item.f18) || 0,
                        tradeTime: tradeTime,
                        isLiquid: isLiquid
                    };
                }
            });
            return Object.values(quoteMap).filter(q => q.price > 0);
        }

        async function scanFullMarket(showAnimation) {
            if (activeModalSecId || isScanning) return;
            isScanning = true;

            const textEl = document.getElementById('countdown-status-text');
            if (textEl) textEl.textContent = `⏳ 正在拉取全市场合约报价…`;
            const timerDot = document.getElementById('compact-timer-dot');
            const timerText = document.getElementById('compact-timer-text');
            if (timerDot) timerDot.textContent = '⚡';
            if (timerText) timerText.textContent = '重扫中';

            try {
                // 0) 休市且不在开盘前窗口：先读云端收盘快照（Cron 已在 15:05 / 23:35 抓好存入 KV）
                //    命中即直接渲染，一个东财请求都不发；避免收盘后接口抓不到的风险。
                if (!isTradingNow() && !inPreOpenWindow()) {
                    const snap = await fetchCloudSnapshot();
                    if (snap && snap.ts && (Date.now() - snap.ts) < SNAP_MAX_AGE_MS) {
                        const snapQuotes = buildQuoteMapFromRaw(snap.diff);
                        const hasUp = snapQuotes.some(q => q.changePercent > 0);
                        const hasDown = snapQuotes.some(q => q.changePercent < 0);
                        // 校验快照完整性：必须同时包含多头与空头，且合约数充足，杜绝残缺单向快照阻断全盘扫描
                        if (snapQuotes.length >= 25 && hasUp && hasDown) {
                            allPhysicalQuotes = snapQuotes;
                            isStep1Ready = true;
                            lastGoodQuotes = snapQuotes.slice();
                            lastGoodTs = snap.ts;
                            quoteSource = 'snapshot';
                            dataMode = 'live';
                            finishScanPass();
                            return;
                        }
                    }
                }

                // 1) 东财 ulist 批量合约池（JSONP 跨域并发秒级直通，全量 ~150-250ms）
                quoteSource = 'ulist';
                let rawList = await fetchQuotesBySecids(buildContractPool().map(p => p.secid));

                // 2) ulist 失败 → 东财 clist 列表快速检测兜底
                if (!rawList.length) {
                    quoteSource = 'clist';
                    rawList = await fetchQuotesViaClist();
                }

                // 3) 东财两条都失败 → 新浪日线兜底（逐合约）
                if (!rawList.length) {
                    if (textEl) textEl.textContent = `⏳ 东财不可用，正通过新浪补全精选合约…`;
                    const sinaQuotes = await scanViaSina(buildContractPool(SINA_POOL_MONTHS));
                    if (sinaQuotes.length) {
                        allPhysicalQuotes = sinaQuotes;
                        isStep1Ready = true;
                        lastGoodQuotes = sinaQuotes.slice();
                        lastGoodTs = Date.now();
                        quoteSource = 'sina';
                        dataMode = 'live';
                        finishScanPass();
                        return;
                    }
                    if (lastGoodQuotes.length) {
                        allPhysicalQuotes = lastGoodQuotes.slice();
                        dataMode = 'cache';
                    } else {
                        dataMode = 'empty';
                    }
                    finishScanPass();
                    return;
                }

                allPhysicalQuotes = buildQuoteMapFromRaw(rawList);
                isStep1Ready = true;

                // 仅在当前运行态内存中保留最近一次成功行情（不写入 localStorage）
                lastGoodQuotes = allPhysicalQuotes.slice();
                lastGoodTs = Date.now();

                dataMode = 'live';
                finishScanPass();
            } catch (err) {
                console.error('Scan full market error:', err);
                if (lastGoodQuotes.length) {
                    allPhysicalQuotes = lastGoodQuotes.slice();
                    dataMode = 'cache';
                } else {
                    dataMode = 'empty';
                }
                finishScanPass();
            } finally {
                isScanning = false;
            }
        }

        // 一次扫描结束后统一收尾：渲染 + 横幅 + 重新决定刷新节奏
        function finishScanPass() {
            filterAndRenderFocusPool();
            const el = document.getElementById('last-update-time');
            if (el) el.textContent = new Date().toTimeString().split(' ')[0];
            updateDataSourceBanner();
            applyRefreshSchedule();
        }

        // 手动刷新：休市时也可以主动拉一次（这条不违反"休市不自动刷"的约定）
        async function manualRefresh() {
            const btn = document.getElementById('manual-refresh-btn');
            if (btn) { btn.disabled = true; btn.textContent = '⟳ 拉取中…'; }
            try {
                fetchGlobalWatchlist(); // 手动刷新时同步拉取一次最新云端自选
                await scanFullMarket(true);
            } finally {
                if (btn) { btn.disabled = false; btn.textContent = '⟳ 手动刷新'; }
            }
        }

        // ==================== 第二步：焦点池高频轻量轮询 (带节拍打点视觉反馈) ====================
        async function refreshFocusPoolPrices() {
            if (!isStep1Ready || activeModalSecId || focusQuotes.length === 0) return;

            const t0 = performance.now();
            const secids = focusQuotes.map(q => q.secid).join(',');
            const url = ulistUrl(secids, focusPollTries++);

            try {
                let json = null;
                try { json = await loadEmJsonp(url, 5000); } catch (e) { json = null; }
                if (!json || !json.data || !json.data.diff) {
                    try { const resp = await fetch(url, { cache: 'no-store' }); json = await resp.json(); } catch (e) { json = null; }
                }
                if (json && json.data && json.data.diff) {
                    const diff = json.data.diff;
                    diff.forEach(item => {
                        const secid = `${item.f13}.${item.f12}`;
                        const target = focusQuotes.find(q => q.secid === secid);
                        if (target && item.f2 && item.f2 !== '-') {
                            target.price = parseFloat(item.f2) || target.price;
                            target.changePercent = parseFloat(item.f3) || target.changePercent;
                            target.change = parseFloat(item.f4) || target.change;
                            target.vol = parseInt(item.f5) || target.vol;
                            target.amount = parseFloat(item.f6) || target.amount;
                            target.high = parseFloat(item.f15) || target.high;
                            target.low = parseFloat(item.f16) || target.low;
                            if (item.f124) target.tradeTime = parseInt(item.f124, 10) * 1000;
                        }
                    });
                    // 原地轻量更新 DOM 价格数值，不重新构建整树
                    updateDOMValuesInPlace();
                    const elapsed = Math.round(performance.now() - t0);
                    triggerLevel2PulseAnimation(elapsed);
                }
            } catch(e) {
                console.warn('Lightweight focus poll error:', e);
            }
        }

        // 当前品种聚合状态及用户各卡片选择月份记录
        let currentVarietyGroups = [];
        const activeVarietyMonthMap = {};

        // 筛选并构建当前焦点池
        function filterAndRenderFocusPool() {
            let list = allPhysicalQuotes;
            let filtered = [];

            if (currentMode === 'custom') {
                filtered = allPhysicalQuotes.filter(q => isFavorite(q.secid, q.code));
                currentVarietyGroups = [];
                focusQuotes = filtered;
            } else if (currentMode === 'surge') {
                filtered = list.filter(q => q.vol >= currentVolThreshold && q.changePercent >= currentThreshold && isQuoteActiveInCurrentSession(q));
                filtered.sort((a, b) => b.changePercent - a.changePercent);
                currentVarietyGroups = [];
                focusQuotes = filtered;
            } else if (currentMode === 'plunge') {
                filtered = list.filter(q => q.vol >= currentVolThreshold && q.changePercent <= -currentThreshold && isQuoteActiveInCurrentSession(q));
                filtered.sort((a, b) => a.changePercent - b.changePercent);
                currentVarietyGroups = [];
                focusQuotes = filtered;
            } else {
                // 默认异动榜 'abs' 模式：按品种聚合收拢
                filtered = list.filter(q => q.vol >= currentVolThreshold && Math.abs(q.changePercent) >= currentThreshold && isQuoteActiveInCurrentSession(q));
                currentVarietyGroups = groupQuotesByVariety(filtered);
                
                // 汇总当前所有品种的活跃月份合约纳入 focusQuotes 以供第2级轮询刷新
                const allGroupQuotes = [];
                currentVarietyGroups.forEach(g => {
                    if (!activeVarietyMonthMap[g.variety] || !g.months.some(m => m.secid === activeVarietyMonthMap[g.variety])) {
                        activeVarietyMonthMap[g.variety] = g.leadQuote.secid;
                    }
                    g.activeSecid = activeVarietyMonthMap[g.variety];
                    g.months.forEach(m => allGroupQuotes.push(m));
                });
                focusQuotes = allGroupQuotes;
            }

            let totalUp = 0;
            let totalDown = 0;
            if (currentMode === 'abs') {
                currentVarietyGroups.forEach(g => {
                    const lead = g.leadQuote;
                    if (lead.change > 0) totalUp++;
                    else if (lead.change < 0) totalDown++;
                });
                document.getElementById('stat-total').textContent = currentVarietyGroups.length;
            } else {
                filtered.forEach(q => {
                    if (q.change > 0) totalUp++;
                    else if (q.change < 0) totalDown++;
                });
                document.getElementById('stat-total').textContent = filtered.length;
            }

            document.getElementById('stat-up').textContent = totalUp;
            document.getElementById('stat-down').textContent = totalDown;

            updateFilterSummaryText();
            if (currentMode === 'abs') {
                renderVarietyCardsDOM(currentVarietyGroups);
            } else {
                renderCardsDOM(filtered);
            }
        }

        // 渲染品种聚合卡片 DOM 结构 (异动榜主视图)
        function renderVarietyCardsDOM(groups) {

            container.innerHTML = groups.map(group => {

                const isActive = isQuoteActiveInCurrentSession(activeQuote);
                const isNightWin = isNightSessionWindow();
                const tradeTimeStr = activeQuote.tradeTime ? formatTradeTime(activeQuote.tradeTime) : '';
                const sessionTagHtml = isNightWin
                    ? (!isActive
                        ? `<span class="tag-stale" title="该品种无夜盘或今晚未开盘 (最后成交: ${tradeTimeStr})">💤 日盘定格</span>`
                        : `<span class="tag-night-active" title="夜盘活跃撮合中 (最后成交: ${tradeTimeStr})">🌙 夜盘</span>`)
                    : '';

                // 渲染各月份胶囊药丸 (Pills，首位即成交量最大的主力合约)
                const monthPillsHtml = group.months.map((m, idx) => {
                    const isAct = m.secid === activeQuote.secid;
                    const mUp = m.changePercent > 0;
                    const mDown = m.changePercent < 0;
                    const mSign = mUp ? '+' : '';
                    const pCls = mUp ? 'pill-up' : mDown ? 'pill-down' : '';
                    const volLabel = m.vol >= 10000 ? (m.vol / 10000).toFixed(1) + '万手' : (m.vol > 0 ? m.vol + '手' : '--');
                    const pillTitle = `${m.code} (${mSign}${m.changePercent.toFixed(2)}%) 成交: ${volLabel}${idx === 0 ? ' [成交量第一/主力]' : ''}`;
                    return `<button class="month-pill ${isAct ? 'active' : ''} ${m.isLead ? 'is-lead' : ''} ${pCls}"
                                    data-pill-secid="${m.secid}"
                                    onclick="switchCardMonth('${group.variety}', '${m.secid}', event)"
                                    title="${pillTitle}">
                        ${m.monthCode} ${mSign}${m.changePercent.toFixed(1)}%${m.isLead ? ' 👑' : ''}
                    </button>`;
                }).join('');

                return `
                <div class="card" id="card-variety-${group.variety}" data-active-secid="${activeQuote.secid}" onclick="openChartModal(this.getAttribute('data-active-secid'))">

                        <div class="contract-info">
                            <span class="contract-name">${group.name}</span>
                            <span class="tag-physical">真实</span>
                            ${sessionTagHtml}
                            <span class="contract-code">${activeQuote.code}</span>
                        </div>
                        
                        <div class="header-pnl-group">
                            <span class="change-badge ${badgeClass}" id="badge-${group.variety}">${sign}${activeQuote.changePercent.toFixed(2)}%</span>
                            <button class="${starClass}" id="star-${group.variety}" onclick="toggleFavorite(document.getElementById('card-variety-${group.variety}').getAttribute('data-active-secid'), '${activeQuote.code}', event)" title="${starTitle}">${starIcon}</button>
                        </div>
                    </div>

                    <div class="month-pills" id="pills-${group.variety}">
                        ${monthPillsHtml}
                    </div>
                    
                    <div class="hero-section">
                        <span class="latest-price ${priceClass}" id="price-${group.variety}">${activeQuote.price > 0 ? activeQuote.price.toLocaleString(undefined, {minimumFractionDigits: activeQuote.price % 1 === 0 ? 0 : 2, maximumFractionDigits: 2}) : '--'}</span>
                        <span class="price-diff-text ${priceClass}" id="diff-${group.variety}">${sign}${activeQuote.change.toFixed(1)} (振幅 ${activeQuote.low > 0 ? (((activeQuote.high - activeQuote.low)/activeQuote.low)*100).toFixed(2) + '%' : '--'})</span>
                    </div>

                    <div class="range-bar-wrapper">
                        <div class="range-bar-labels">
                            <span id="low-${group.variety}">低: ${activeQuote.low > 0 ? activeQuote.low : '--'}</span>
                            <span id="high-${group.variety}">高: ${activeQuote.high > 0 ? activeQuote.high : '--'}</span>
                        </div>
                        <div class="range-track">
                            <div class="range-progress" id="prog-${group.variety}" style="width: ${ratio}%;"></div>
                            <div class="range-point" id="point-${group.variety}" style="left: ${ratio}%;"></div>

                    </div>
                </div>
                `;
            }).join('');
        }

        // 原地切换品种卡片内的显示月份 (0% 页面抖动，0ms 重新布局)
        function switchCardMonth(varietyKey, targetSecid, event) {
            if (event) {
                event.stopPropagation();
                event.preventDefault();
            }
            activeVarietyMonthMap[varietyKey] = targetSecid;
            const group = currentVarietyGroups.find(g => g.variety === varietyKey);
            if (!group) return;
            group.activeSecid = targetSecid;
            const targetQuote = group.months.find(m => m.secid === targetSecid);
            if (!targetQuote) return;

            const card = document.getElementById(`card-variety-${varietyKey}`);
            if (!card) return;

            card.setAttribute('data-active-secid', targetSecid);

            // 更新头部合约代码
            const codeEl = card.querySelector('.contract-code');
            if (codeEl) codeEl.textContent = targetQuote.code;

            // 更新星标自选按钮
            const favBtn = document.getElementById(`star-${varietyKey}`);
            if (favBtn) {
                const fav = isFavorite(targetQuote.secid, targetQuote.code);
                favBtn.className = fav ? 'star-btn star-active' : 'star-btn star-inactive';
                favBtn.textContent = fav ? '★' : '☆';
                favBtn.setAttribute('onclick', `toggleFavorite('${targetQuote.secid}', '${targetQuote.code}', event)`);
            }

            // 更新涨跌Badge
            const badgeEl = document.getElementById(`badge-${varietyKey}`);
            const isUp = targetQuote.change > 0;
            const isDown = targetQuote.change < 0;
            const sign = isUp ? '+' : '';
            const badgeClass = isUp ? 'is-up-badge' : isDown ? 'is-down-badge' : 'is-flat-badge';
            if (badgeEl) {
                badgeEl.className = `change-badge ${badgeClass}`;
                badgeEl.textContent = `${sign}${targetQuote.changePercent.toFixed(2)}%`;

                priceEl.className = `latest-price ${priceClass}`;
                priceEl.textContent = targetQuote.price > 0 ? targetQuote.price.toLocaleString(undefined, {minimumFractionDigits: targetQuote.price % 1 === 0 ? 0 : 2, maximumFractionDigits: 2}) : '--';

            if (diffEl) {
                diffEl.className = `price-diff-text ${priceClass}`;
                diffEl.textContent = `${sign}${targetQuote.change.toFixed(1)} (振幅 ${targetQuote.low > 0 ? (((targetQuote.high - targetQuote.low)/targetQuote.low)*100).toFixed(2) + '%' : '--'})`;

            const highEl = document.getElementById(`high-${varietyKey}`);

            if (highEl) highEl.textContent = `高: ${targetQuote.high > 0 ? targetQuote.high : '--'}`;
            if (progEl) progEl.style.width = `${ratio}%`;
            if (pointEl) pointEl.style.left = `${ratio}%`;

            // 更新各 month-pill 激活样式
            const pills = card.querySelectorAll('.month-pill');
            pills.forEach(p => {
                const pSecid = p.getAttribute('data-pill-secid');
                p.classList.toggle('active', pSecid === targetSecid);
            });
        }

        // 精确判断是否在自选列表
        function isFavorite(secid, code) {
            const lowSec = secid.toLowerCase();
            const lowCode = code.toLowerCase();
            return customWatchlist.some(c => {
                const res = resolveSecId(c);
                const targetSec = res ? res.secid.toLowerCase() : c.toLowerCase();
                const targetSym = res ? res.symbol.toLowerCase() : c.toLowerCase();
                return targetSec === lowSec || targetSym === lowCode || c.toLowerCase() === lowCode;
            });
        }

        function toggleFavorite(secid, code, e) {
            if (e) e.stopPropagation();
            if (isFavorite(secid, code)) {
                const lowSec = secid.toLowerCase();
                const lowCode = code.toLowerCase();
                customWatchlist = customWatchlist.filter(c => {
                    const res = resolveSecId(c);
                    const targetSec = res ? res.secid.toLowerCase() : c.toLowerCase();
                    const targetSym = res ? res.symbol.toLowerCase() : c.toLowerCase();
                    return !(targetSec === lowSec || targetSym === lowCode || c.toLowerCase() === lowCode);
                });
            } else {
                customWatchlist.unshift(code);
            }
            saveWatchlist();
            filterAndRenderFocusPool();
        }

        // ==================== 第三步：K 线与分时图按需点播 (新浪期货专业高精数据引擎) ====================
        function getSinaFuturesSymbol(secid, code) {
            let raw = '';
            if (code) raw = code;
            else if (secid && secid.includes('.')) raw = secid.split('.')[1];
            else raw = secid || '';

            raw = raw.toUpperCase().trim();
            // 郑商所等 3 位数字格式标准化 (如 MA610 -> MA2610, OI603 -> OI2603, SA505 -> SA2505)
            const m3 = raw.match(/^([A-Z]+)(\d)(\d{2})$/);
            if (m3) {
                const variety = m3[1];
                const yearDigit = parseInt(m3[2]);
                const monthStr = m3[3];
                return `${variety}2${yearDigit}${monthStr}`;
            }
            return raw;
        }

        // 统一超稳定 JSONP 加载器 (带 Object.defineProperty 零延迟拦截)
        function loadSinaFuturesJsonp(url) {
            return new Promise((resolve) => {
                const cbName = 'sina_cb_' + Date.now() + '_' + Math.floor(Math.random() * 100000);
                const script = document.createElement('script');
                const reqUrl = url.replace('CALLBACK_VAR', cbName);
                let receivedData = null;
                let isHandled = false;

                try {
                    Object.defineProperty(window, cbName, {
                        set: function(val) { receivedData = val; },
                        get: function() { return receivedData; },
                        configurable: true
                    });
                } catch(e) {}

                const timer = setTimeout(() => {
                    done(receivedData);
                }, 4000);

                function done(res) {
                    if (isHandled) return;
                    isHandled = true;
                    if (timer) clearTimeout(timer);
                    try { delete window[cbName]; } catch(e) {}
                    if (script.parentNode) script.parentNode.removeChild(script);
                    resolve(Array.isArray(res) ? res : null);
                }

                script.onload = function() {
                    done(receivedData || window[cbName]);
                };

                script.onerror = function() {
                    done(null);
                };

                script.src = reqUrl;
                document.head.appendChild(script);
            });
        }

        // ==================== PWA 原生路由守卫与手势拦截 (History Guard) ====================
        let pwaToastTimer = null;
        let _isPwaGuardInitialized = false;
        let lastUserTouchTime = 0;

        function showPwaToast(msg = '请从屏幕底部上滑退出应用') {
            let toast = document.getElementById('pwa-guard-toast');
            if (!toast) {
                toast = document.createElement('div');
                toast.id = 'pwa-guard-toast';
                toast.className = 'pwa-guard-toast';
                (document.body || document.documentElement).appendChild(toast);
            }
            toast.textContent = msg;
            toast.classList.remove('visible');
            void toast.offsetWidth; // 触发 reflow，确保多次连续拦截时微动效平滑刷新
            toast.classList.add('visible');

            if (pwaToastTimer) clearTimeout(pwaToastTimer);
            pwaToastTimer = setTimeout(() => {
                if (toast) toast.classList.remove('visible');
            }, 2000);
        }

        function pushPwaGuardState() {
            try {
                window.history.pushState({ pwaGuard: true, ts: Date.now() }, '', window.location.href);
            } catch (e) {
                // 部分私密模式或极端沙盒环境做静默降级处理
            }
        }

        // 双层缓冲加固：确立至少 2 层历史栈深度，彻底防止连续快速侧滑击穿见底
        function reinforceGuardBuffer() {
            pushPwaGuardState();
            pushPwaGuardState();
        }

        function initPwaHistoryGuard() {
            if (_isPwaGuardInitialized) return;
            _isPwaGuardInitialized = true;

            // 1. 初始化时压入双重守卫缓冲
            reinforceGuardBuffer();

            // 2. 用户任意手势交互时（享有 Transient User Activation 用户激活态），重新加固守卫栈
            //    这从根源上消除 Chromium History Manipulation Intervention 判定
            //    防止浏览器误判“无交互脚本劫持”而跳过 pushState 退出应用
            const onUserTouch = () => {
                const now = Date.now();
                if (now - lastUserTouchTime > 2500) {
                    lastUserTouchTime = now;
                    pushPwaGuardState();
                }
            };
            window.addEventListener('touchstart', onUserTouch, { passive: true });
            window.addEventListener('pointerdown', onUserTouch, { passive: true });

            // 3. 监听系统/手势后退 (Android 全面屏边缘侧滑返回、物理/虚拟 Back 键)
            window.addEventListener('popstate', (e) => {
                if (activeModalSecId) {
                    // 若当前处于二级图表面板：关闭二级面板回到主看板
                    closeChartModal(true);
                    // 补充双层守卫缓冲，确保回到主看板后历史栈深度饱满
                    reinforceGuardBuffer();
                } else {
                    // 若当前已处于一级主页面：立即连续补栈，原地拦截杜绝退出应用
                    reinforceGuardBuffer();
                    showPwaToast('请从屏幕底部上滑退出应用');
                }
            });

            // 4. 切后台重回应用（前台唤醒）或页面显示时再次补强
            document.addEventListener('visibilitychange', () => {
                if (!document.hidden) reinforceGuardBuffer();
            });
            window.addEventListener('pageshow', () => {
                reinforceGuardBuffer();
            });
        }

        function openChartModal(secid, isNavigating = false) {

        // 切换上一个 / 下一个合约 (按当前列表排序，平滑切合约不污染历史栈)
        function navContract(delta) {
            if (!focusQuotes || focusQuotes.length === 0) return;
            const idx = focusQuotes.findIndex(q => q.secid === activeModalSecId);
            let nextIdx = 0;
            if (idx >= 0) {
                nextIdx = (idx + delta + focusQuotes.length) % focusQuotes.length;
            } else {
                nextIdx = 0;
            }
            openChartModal(focusQuotes[nextIdx].secid, true);
        }

        // 弹窗内滚轮事件拦截与智能空间分发 (100% 阻止底层主页面滚动)
        // 智能感应设计：
        // 1. 鼠标在 K 线图画布范围内部滚动：对 K 线进行缩放 (放大/缩小视口)
        // 2. 鼠标在 K 线图画布外部区域 (顶部标题栏、导航栏、图例条、背景间隙等) 滚动：上下无缝切换合约
        function handleModalWheel(e) {
            if (!activeModalSecId) return;
            e.preventDefault();
            e.stopPropagation();

            const canvas = document.getElementById('pro-chart-canvas');
            const wrapper = document.getElementById('chart-wrapper');
            // 判断滚轮是否处于 K 线图容器内部
            const isInsideChart = (e.target === canvas || (wrapper && wrapper.contains(e.target)));

            if (isInsideChart && currentChartType !== 'trend') {
                // 图表内滚轮：缩放 K 线大小 (本地 0ms 高性能重绘)
                if (!cachedFullKlines || cachedFullKlines.length === 0) return;
                
                const delta = e.deltaY < 0 ? -10 : 10;
                const minBars = 20;
                const maxBars = cachedFullKlines.length;
                
                let nextCount = currentVisibleCount + delta;
                nextCount = Math.max(minBars, Math.min(maxBars, nextCount));
                
                if (nextCount !== currentVisibleCount) {
                    currentVisibleCount = nextCount;
                    redrawKlineCanvasOnly();
                }
            } else {
                // 图表外滚轮 (或分时图下)：上下切换合约 (加入 180ms 平滑防抖)
                const now = performance.now();
                if (now - lastWheelSwitchTime < 180) return;
                lastWheelSwitchTime = now;
                
                if (e.deltaY < 0) navContract(-1); // 向上滚：上一个合约
                else if (e.deltaY > 0) navContract(1);  // 向下滚：下一个合约
            }
        }

        // 键盘快捷键 (Esc关闭, ↑/↓/PgUp/PgDn切合约, +-缩放)
        function handleModalKeyDown(e) {
            if (!activeModalSecId) return;
            if (e.key === 'Escape') {
                closeChartModal();
            } else if (e.key === 'ArrowUp' || e.key === 'PageUp') {
                e.preventDefault();
                navContract(-1);
            } else if (e.key === 'ArrowDown' || e.key === 'PageDown') {
                e.preventDefault();
                navContract(1);
            } else if (e.key === '+' || e.key === '=' || e.key === 'ArrowLeft') {
                if (cachedFullKlines && cachedFullKlines.length > 0 && currentChartType !== 'trend') {
                    currentVisibleCount = Math.max(20, currentVisibleCount - 10);
                    redrawKlineCanvasOnly();
                }
            } else if (e.key === '-' || e.key === '_' || e.key === 'ArrowRight') {
                if (cachedFullKlines && cachedFullKlines.length > 0 && currentChartType !== 'trend') {
                    currentVisibleCount = Math.min(cachedFullKlines.length, currentVisibleCount + 10);
                    redrawKlineCanvasOnly();
                }
            }
        }

        // 触控 / 鼠标 共用：根据画布 X 坐标显示对应 K 柱 / 分时点详情
        function showBarInfoAtX(x) {

            if (currentChartType === 'trend') {
                if (!activeTrendData || !activeTrendData.visibleBars || activeTrendData.visibleBars.length === 0) return;
                const { visibleBars, getX, prePrice } = activeTrendData;

                let closest = null;
                let minDiff = Infinity;
                for (let item of visibleBars) {
                    const itemX = getX(item);
                    const diff = Math.abs(itemX - x);
                    if (diff < minDiff) {
                        minDiff = diff;
                        closest = item;
                    }
                }
                if (closest && minDiff < 45) {
                    const isUp = closest.price >= prePrice;
                    const diffP = closest.price - prePrice;
                    const ratio = prePrice > 0 ? ((diffP / prePrice) * 100).toFixed(2) : '0.00';
                    infoEl.innerHTML = `
                        <span style="color:#8b9db7;">${closest.dateStr || closest.time}</span> |
                        <span style="color:${isUp ? '#f85149' : '#2ea043'}; font-weight:bold;">现价: ${closest.price.toFixed(1)} (${diffP >= 0 ? '+' : ''}${diffP.toFixed(1)}, ${ratio}%)</span> |
                        <span style="color:#f1c40f;">均价: ${closest.vwap.toFixed(1)}</span> |
                        <span>量: ${closest.vol}手</span>
                    `;
                }
                return;
            }

            if (!activeRenderData) return;
            const { klines, step } = activeRenderData;
            const idx = Math.floor(x / step);
            if (idx < 0 || idx >= klines.length) return;
            const k = klines[idx];
            const isUp = k.close >= k.open;
            infoEl.innerHTML = `
                <span>${k.date}</span> |
                <span>开: ${k.open}</span>
                <span>高: ${k.high}</span>
                <span>低: ${k.low}</span>
                <span style="color:${isUp ? '#f85149' : '#2ea043'}; font-weight:bold;">收: ${k.close}</span> |
                <span>量: ${k.vol}手</span>
            `;
        }

        // Overview 迷你小地图点击与拖拽命中检测
        function getOverviewHit(px, py) {
            if (currentChartType !== 'trend' || !trendOverviewRect) return null;
            const { x, y, w, h, vx1, vx2 } = trendOverviewRect;
            // 手机触屏扩大上下触控热区，让手指更容易按住滑块
            if (py < y - 10 || py > y + h + 14 || px < x - 12 || px > x + w + 12) return null;
            if (Math.abs(px - vx1) <= 16) return 'left';
            if (Math.abs(px - vx2) <= 16) return 'right';
            if (px >= vx1 && px <= vx2) return 'pan';
            return 'jump';
        }

        // 触控手势：双指捏合缩放 K 线、单指拖动平移、单指上下滑切换合约（全屏阻止页面穿透滚动）
        let touchState = null;
        let touchBound = false;
        function bindChartTouch(canvas) {
            if (touchBound || !canvas) return;
            touchBound = true;

            canvas.addEventListener('touchstart', (e) => {
                if (e.touches.length === 1 && currentChartType === 'trend' && trendOverviewRect) {
                    const rect = canvas.getBoundingClientRect();
                    const px = e.touches[0].clientX - rect.left;
                    const py = e.touches[0].clientY - rect.top;
                    const hit = getOverviewHit(px, py);
                    if (hit) {
                        e.preventDefault();
                        e.stopPropagation();
                        if (hit === 'jump') {
                            const { x, w } = trendOverviewRect;
                            const curSpan = trendViewEndRatio - trendViewStartRatio;
                            const centerRatio = (px - x) / w;
                            let nStart = centerRatio - curSpan / 2;
                            let nEnd = centerRatio + curSpan / 2;
                            if (nStart < 0) { nEnd -= nStart; nStart = 0; }
                            if (nEnd > 1) { nStart -= (nEnd - 1); nEnd = 1; }
                            trendViewStartRatio = Math.max(0, nStart);
                            trendViewEndRatio = Math.min(1, nEnd);
                            redrawTrendCanvasOnly();
                            overviewDragState = { mode: 'pan', startX: px, startLeft: trendViewStartRatio, startRight: trendViewEndRatio };
                        } else {
                            overviewDragState = { mode: hit, startX: px, startLeft: trendViewStartRatio, startRight: trendViewEndRatio };
                        }
                        return;
                    }
                }

                if (e.touches.length === 2) {
                    if (currentChartType === 'trend' || !cachedFullKlines || cachedFullKlines.length === 0) return;
                    const dx = e.touches[0].clientX - e.touches[1].clientX;
                    const dy = e.touches[0].clientY - e.touches[1].clientY;
                    touchState = { mode: 'pinch', startDist: Math.hypot(dx, dy), startCount: currentVisibleCount };
                } else if (e.touches.length === 1) {
                    touchState = {
                        mode: 'pan',
                        startX: e.touches[0].clientX,
                        startY: e.touches[0].clientY,
                        initialViewStart: chartViewStart,
                        lastX: e.touches[0].clientX,
                        lastY: e.touches[0].clientY,
                        swipedContract: false,
                        moved: false
                    };
                }
            }, { passive: false });

            canvas.addEventListener('touchmove', (e) => {
                if (overviewDragState && currentChartType === 'trend' && trendOverviewRect) {
                    e.preventDefault();
                    e.stopPropagation();
                    const rect = canvas.getBoundingClientRect();
                    const px = e.touches[0].clientX - rect.left;
                    const dx = px - overviewDragState.startX;
                    const dxRatio = dx / trendOverviewRect.w;
                    const minSpan = 0.05;

                    if (overviewDragState.mode === 'pan') {
                        const span = Math.max(minSpan, overviewDragState.startRight - overviewDragState.startLeft);
                        let nStart = overviewDragState.startLeft + dxRatio;
                        let nEnd = overviewDragState.startRight + dxRatio;
                        if (nStart < 0) { nStart = 0; nEnd = span; }
                        if (nEnd > 1) { nEnd = 1; nStart = 1 - span; }
                        trendViewStartRatio = Math.max(0, Math.min(1 - span, nStart));
                        trendViewEndRatio = Math.max(span, Math.min(1, nEnd));
                    } else if (overviewDragState.mode === 'left') {
                        trendViewStartRatio = Math.max(0, Math.min(overviewDragState.startRight - minSpan, overviewDragState.startLeft + dxRatio));
                    } else if (overviewDragState.mode === 'right') {
                        trendViewEndRatio = Math.min(1.0, Math.max(overviewDragState.startLeft + minSpan, overviewDragState.startRight + dxRatio));
                    }
                    redrawTrendCanvasOnly();
                    return;
                }

                if (!touchState) return;
                e.preventDefault(); // 阻止手机浏览器默认滚动/下拉刷新

                if (touchState.mode === 'pinch' && e.touches.length === 2) {
                    if (currentChartType === 'trend' || !cachedFullKlines || cachedFullKlines.length === 0) return;
                    const dx = e.touches[0].clientX - e.touches[1].clientX;
                    const dy = e.touches[0].clientY - e.touches[1].clientY;
                    const dist = Math.hypot(dx, dy);
                    if (touchState.startDist > 0) {
                        const ratio = dist / touchState.startDist;
                        const minBars = 20, maxBars = cachedFullKlines.length;
                        let next = Math.round(touchState.startCount / ratio);
                        next = Math.max(minBars, Math.min(maxBars, next));
                        if (next !== currentVisibleCount) { currentVisibleCount = next; redrawKlineCanvasOnly(); }
                    }
                } else if (touchState.mode === 'pan' && e.touches.length === 1) {
                    const x = e.touches[0].clientX;
                    const y = e.touches[0].clientY;
                    const dx = x - touchState.startX;
                    const dy = y - touchState.startY;

                    if (Math.abs(dx) > 6 || Math.abs(dy) > 6) touchState.moved = true;

                    // 1. 垂直滑动手势：单指上滑 / 下滑直接切换上一合约 / 下一合约
                    if (!touchState.swipedContract && Math.abs(dy) > 42 && Math.abs(dy) > Math.abs(dx) * 1.25) {
                        touchState.swipedContract = true;
                        if (dy < -42) {
                            navContract(1);
                        } else if (dy > 42) {
                            navContract(-1);
                        }
                        return;
                    }

                    // 2. 水平平移手势：K 线图左右拖动查看历史时间轴
                    if (!touchState.swipedContract && currentChartType !== 'trend' && cachedFullKlines && cachedFullKlines.length > 0) {
                        const stepPx = (canvas.clientWidth / currentVisibleCount) || 6;
                        const barDelta = Math.round(dx / stepPx);
                        const total = cachedFullKlines.length;
                        let nv = touchState.initialViewStart + barDelta;
                        nv = Math.max(0, Math.min(total - currentVisibleCount, nv));
                        if (nv !== chartViewStart) {
                            chartViewStart = nv;
                            redrawKlineCanvasOnly();
                        }
                    } else if (!touchState.swipedContract && currentChartType === 'trend') {
                        // 分时图下水平拖动：跟随手指显示对应时段报价明细
                        const rect = canvas.getBoundingClientRect();
                        showBarInfoAtX(x - rect.left);
                    }
                }
            }, { passive: false });

            canvas.addEventListener('touchend', (e) => {
                if (overviewDragState) {
                    overviewDragState = null;
                    return;
                }
                if (touchState && touchState.mode === 'pan' && !touchState.moved && !touchState.swipedContract && e.changedTouches.length === 1) {
                    const rect = canvas.getBoundingClientRect();
                    showBarInfoAtX(e.changedTouches[0].clientX - rect.left);
                }
                if (touchState && touchState.mode === 'pinch' && e.touches.length < 2) {
                    touchState = null;
                    return;
                }
                if (e.touches.length === 0) {
                    touchState = null;
                }
            });

            canvas.addEventListener('touchcancel', () => {
                overviewDragState = null;
                touchState = null;
            });

            // 桌面端鼠标：Overview 拖拽与十字光标联动
            canvas.addEventListener('mousedown', (e) => {
                if (currentChartType !== 'trend' || !trendOverviewRect) return;
                const rect = canvas.getBoundingClientRect();
                const px = e.clientX - rect.left;
                const py = e.clientY - rect.top;
                const hit = getOverviewHit(px, py);
                if (hit) {
                    e.preventDefault();
                    if (hit === 'jump') {
                        const { x, w } = trendOverviewRect;
                        const curSpan = trendViewEndRatio - trendViewStartRatio;
                        const centerRatio = (px - x) / w;
                        let nStart = centerRatio - curSpan / 2;
                        let nEnd = centerRatio + curSpan / 2;
                        if (nStart < 0) { nEnd -= nStart; nStart = 0; }
                        if (nEnd > 1) { nStart -= (nEnd - 1); nEnd = 1; }
                        trendViewStartRatio = Math.max(0, nStart);
                        trendViewEndRatio = Math.min(1, nEnd);
                        redrawTrendCanvasOnly();
                        overviewDragState = { mode: 'pan', startX: px, startLeft: trendViewStartRatio, startRight: trendViewEndRatio };
                    } else {
                        overviewDragState = { mode: hit, startX: px, startLeft: trendViewStartRatio, startRight: trendViewEndRatio };
                    }
                }
            });

            window.addEventListener('mousemove', (e) => {
                if (overviewDragState && currentChartType === 'trend' && trendOverviewRect) {
                    const rect = canvas.getBoundingClientRect();
                    const px = e.clientX - rect.left;
                    const dx = px - overviewDragState.startX;
                    const dxRatio = dx / trendOverviewRect.w;
                    const minSpan = 0.05;

                    if (overviewDragState.mode === 'pan') {
                        const span = Math.max(minSpan, overviewDragState.startRight - overviewDragState.startLeft);
                        let nStart = overviewDragState.startLeft + dxRatio;
                        let nEnd = overviewDragState.startRight + dxRatio;
                        if (nStart < 0) { nStart = 0; nEnd = span; }
                        if (nEnd > 1) { nEnd = 1; nStart = 1 - span; }
                        trendViewStartRatio = Math.max(0, Math.min(1 - span, nStart));
                        trendViewEndRatio = Math.max(span, Math.min(1, nEnd));
                    } else if (overviewDragState.mode === 'left') {
                        trendViewStartRatio = Math.max(0, Math.min(overviewDragState.startRight - minSpan, overviewDragState.startLeft + dxRatio));
                    } else if (overviewDragState.mode === 'right') {
                        trendViewEndRatio = Math.min(1.0, Math.max(overviewDragState.startLeft + minSpan, overviewDragState.startRight + dxRatio));
                    }
                    redrawTrendCanvasOnly();
                    return;
                }

                if (e.target === canvas) {
                    const rect = canvas.getBoundingClientRect();
                    showBarInfoAtX(e.clientX - rect.left);
                }
            });

            window.addEventListener('mouseup', () => {
                if (overviewDragState) {
                    overviewDragState = null;
                }
            });

            canvas.addEventListener('mouseleave', () => {
                if (!overviewDragState) {
                    updateChartLegendText();
                }
            });
        }

        async function renderProChart() {
            if (!activeModalSecId) return;

            const myVersion = ++chartReqVersion;
            const loadingBar = document.getElementById('modal-loading-bar');
            const statusEl = document.getElementById('chart-status-text');
            
            // 1. 触发微光加载条
            if (loadingBar) loadingBar.className = 'modal-loading-bar active';
            const startTime = performance.now();

            const canvas = document.getElementById('pro-chart-canvas');
            const container = document.getElementById('chart-wrapper');
            const dpr = window.devicePixelRatio || 1;
            const w = (container && container.clientWidth) ? container.clientWidth : 1040;
            const h = (container && container.clientHeight) ? container.clientHeight : 520;
            canvas.width = Math.round(w * dpr);
            canvas.height = Math.round(h * dpr);
            canvas.style.width = w + 'px';
            canvas.style.height = h + 'px';

            const ctx = canvas.getContext('2d');
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
            ctx.clearRect(0, 0, w, h);

            try {
                if (currentChartType === 'trend') {
                    if (statusEl) statusEl.innerHTML = `⏳ 正在拉取 ${activeModalQuote.name} 当日分时数据...`;
                    updateChartLegendText();
                    const count = await drawTrendChart(ctx, w, h);
                    const elapsed = Math.round(performance.now() - startTime);
                    if (statusEl) {
                        statusEl.innerHTML = count > 0 ? 
                            `✅ 已成功加载 ${count} 个分时数据点 (耗时 ${elapsed}ms)` : 
                            `ℹ️ 暂无分时数据或当前非交易时段 (耗时 ${elapsed}ms)`;
                    }
                } else {
                    const isDay = (currentChartType === '101');
                    const mobile = (w <= 600);
                    const reqBars = isDay ? (mobile ? 45 : 70) : (mobile ? 60 : 100);
                    const kName = currentChartType === '5' ? '5分钟K' : 
                                  currentChartType === '15' ? '15分钟K' : 
                                  currentChartType === '60' ? '60分钟K' : '日K线';

                    if (statusEl) statusEl.innerHTML = `⏳ 正在向历史服务器请求 ${reqBars} 根 ${kName} 数据...`;
                    updateChartLegendText();

                    const count = await drawKlineChart(ctx, w, h, currentChartType, reqBars);
                    const elapsed = Math.round(performance.now() - startTime);
                    if (statusEl) {
                        statusEl.innerHTML = count > 0 ? 
                            `✅ 已成功加载 ${cachedFullKlines.length} 根真实 K 柱 (耗时 ${elapsed}ms)` : 
                            `ℹ️ 暂无历史 K 柱数据或该合约已交割 (耗时 ${elapsed}ms)`;
                    }
                }
            } catch (err) {
                console.error('Render pro chart:', err);
                if (statusEl) statusEl.innerHTML = `ℹ️ 图表数据已就绪`;
            } finally {
                if (loadingBar) {
                    loadingBar.className = 'modal-loading-bar done';
                    setTimeout(() => {
                        if (loadingBar) loadingBar.className = 'modal-loading-bar';
                    }, 300);
                }
            }
        }

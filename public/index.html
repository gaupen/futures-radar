        // 将时分转换为当前时段模板下的分钟槽位 slotIndex (0 ~ totalMinutes)
        function convertTimeToSlotIndex(timeStr, sessionConfig) {
            if (!timeStr) return 0;
            let cleanTime = timeStr.trim();
            if (cleanTime.includes(' ')) {
                cleanTime = cleanTime.split(' ')[1] || cleanTime;
            }
            const parts = cleanTime.split(':');
            let h = parseInt(parts[0], 10);
            let m = parseInt(parts[1] || '0', 10);
            if (isNaN(h) || isNaN(m)) return 0;

            // 若夜盘跨午夜 (00:00 - 02:30)，且当前时段支持夜盘跨天，0点/1点/2点视作 24点/25点/26点
            if (sessionConfig.nightPastMidnight && h < 8) {
                h += 24;
            }

            const curTotalM = h * 60 + m;

            for (let i = 0; i < sessionConfig.segments.length; i++) {
                const seg = sessionConfig.segments[i];
                const sStart = seg.startH * 60 + seg.startM;
                const sEnd = seg.endH * 60 + seg.endM;

                if (curTotalM >= sStart && curTotalM <= sEnd) {
                    return seg.baseMin + (curTotalM - sStart);
                }

                // 处于段间休息小憩期 (如 10:15-10:30 或 11:30-13:30)
                if (i < sessionConfig.segments.length - 1) {
                    const nextSeg = sessionConfig.segments[i + 1];
                    const nextStart = nextSeg.startH * 60 + nextSeg.startM;
                    if (curTotalM > sEnd && curTotalM < nextStart) {
                        return seg.baseMin + seg.duration;
                    }
                }
            }

            // 早于首段开盘归入 0
            const firstSeg = sessionConfig.segments[0];
            if (curTotalM < (firstSeg.startH * 60 + firstSeg.startM)) return 0;

            // 晚于末段收盘归入 totalMinutes
            return sessionConfig.totalMinutes;
        }

        // ==================== 多日分时全量数据与 TradingView 级 Overview 引擎 ====================
        // 计算期货时段对应的真实交易所交易日与时间戳归属 (夜盘 20:00~24:00 计入下一交易日，周五夜盘计入下周一)
        function getFuturesTradingDay(dateStr) {
            if (!dateStr) return { tradingDay: '', shortLabel: '' };
            const parts = dateStr.trim().split(' ');
            const ymd = parts[0];
            const hm = parts[1] || '00:00';
            const ymdParts = ymd.split('-').map(Number);
            const hmParts = hm.split(':').map(Number);
            const year = ymdParts[0] || 2026;
            const month = ymdParts[1] || 1;
            const day = ymdParts[2] || 1;
            const hour = hmParts[0] || 0;
            const minute = hmParts[1] || 0;

            const d = new Date(year, month - 1, day, hour, minute);
            if (hour >= 20) {
                const dayOfWeek = d.getDay(); // 0 是周日，5 是周五
                const addDays = (dayOfWeek === 5) ? 3 : (dayOfWeek === 6 ? 2 : 1);
                d.setDate(d.getDate() + addDays);
            }
            const tYear = d.getFullYear();
            const tMonth = String(d.getMonth() + 1).padStart(2, '0');
            const tDay = String(d.getDate()).padStart(2, '0');
            const weekdays = ['日', '一', '二', '三', '四', '五', '六'];
            const tWeekday = weekdays[d.getDay()];

            return {
                tradingDay: `${tYear}-${tMonth}-${tDay}`,
                shortLabel: `${tMonth}/${tDay} ${tWeekday}`
            };
        }

        // 多日 1 分钟全量数据高精加载通道 (优先东财官方 5 日分时含交易所官方 VWAP，备用新浪)
        async function loadMultiDayTrendBars(secid, symbol) {
            let list = [];

            // 1. 优先获取东财官方 5 日逐分历史分时 (天然自带交易所逐分成交均价 VWAP 与昨结基准)
            if (secid) {
                try {
                    const emUrl = `https://push2his.eastmoney.com/api/qt/stock/trends2/get?secid=${secid}&fields1=f1,f2,f3,f4,f5,f6,f7,f8,f9,f10,f11,f12,f13&fields2=f51,f52,f53,f54,f55,f56,f57,f58&ndays=5`;
                    const resp = await fetch(emUrl);
                    if (resp.ok) {
                        const json = await resp.json();
                        if (json && json.data && Array.isArray(json.data.trends) && json.data.trends.length > 0) {
                            if (json.data.preSettlement > 0) {
                                cachedTrendOfficialPrePrice = json.data.preSettlement;
                            } else if (json.data.prePrice > 0) {
                                cachedTrendOfficialPrePrice = json.data.prePrice;
                            }
                            list = json.data.trends.map(tStr => {
                                const parts = tStr.split(',');
                                const timeStr = parts[0] || '';
                                const datePart = timeStr.includes(' ') ? timeStr.split(' ')[0] : '';
                                const timePart = timeStr.includes(' ') ? timeStr.split(' ')[1].substring(0, 5) : '';
                                const p = parseFloat(parts[2]) || 0;
                                const o = parseFloat(parts[1]) || p;
                                const h = parseFloat(parts[3]) || p;
                                const l = parseFloat(parts[4]) || p;
                                const v = parseInt(parts[5], 10) || 0;
                                const officialVwap = parseFloat(parts[7]);
                                return {
                                    dateStr: timeStr,
                                    date: datePart,
                                    time: timePart,
                                    price: p,
                                    open: o,
                                    high: h,
                                    low: l,
                                    vol: v,
                                    vwap: (officialVwap > 0 ? officialVwap : p)
                                };
                            }).filter(b => b.price > 0);
                        }
                    }
                } catch (e) {
                    console.warn('Load EastMoney 5-day trends failed, trying Sina fallback:', e);
                }
            }

            // 2. 备用通道 1：新浪 1 分钟多日分时接口 (1023 根，约 3~5 个交易日)
            if (!list || list.length === 0) {
                try {
                    const min1Url = `https://stock2.finance.sina.com.cn/futures/api/jsonp.php/var%20CALLBACK_VAR=/InnerFuturesNewService.getFewMinLine?symbol=${symbol}&type=1`;
                    const res = await loadSinaFuturesJsonp(min1Url);
                    if (res && Array.isArray(res) && res.length > 0) {
                        list = res.map(item => {
                            const dateStr = item.d || '';
                            const datePart = dateStr.includes(' ') ? dateStr.split(' ')[0] : '';
                            const timePart = dateStr.includes(' ') ? dateStr.split(' ')[1].substring(0, 5) : '';
                            const c = parseFloat(item.c) || 0;
                            const o = parseFloat(item.o) || c;
                            const h = parseFloat(item.h) || c;
                            const l = parseFloat(item.l) || c;
                            const v = parseInt(item.v, 10) || 0;
                            return {
                                dateStr,
                                date: datePart,
                                time: timePart,
                                price: c,
                                open: o,
                                high: h,
                                low: l,
                                vol: v,
                                vwap: c
                            };
                        }).filter(b => b.price > 0);
                    }
                } catch (e) {
                    console.warn('Load multi-day 1-min line failed:', e);
                }
            }

            // 3. 备用通道 2：新浪单日 getMinLine (含交易所官方 VWAP 均价)
            if (!list || list.length === 0) {
                try {
                    const minUrl = `https://stock2.finance.sina.com.cn/futures/api/jsonp.php/var%20CALLBACK_VAR=/InnerFuturesNewService.getMinLine?symbol=${symbol}`;
                    const minArr = await loadSinaFuturesJsonp(minUrl);
                    if (minArr && Array.isArray(minArr) && minArr.length > 0) {
                        list = minArr.map(item => ({
                            dateStr: item[6] ? `${item[6]} ${item[0]}:00` : item[0],
                            date: item[6] || '',
                            time: item[0] || '',
                            price: parseFloat(item[1]) || 0,
                            open: parseFloat(item[1]) || 0,
                            high: parseFloat(item[1]) || 0,
                            low: parseFloat(item[1]) || 0,
                            vwap: parseFloat(item[2]) || parseFloat(item[1]) || 0,
                            vol: parseInt(item[3], 10) || 0
                        })).filter(d => d.price > 0);
                    }
                } catch (e) {
                    console.warn('Load single-day min line failed:', e);
                }
            }

            // 4. 严谨标定交易日断开分界点 (绝不在跨日时拉斜线连接)
            if (list.length > 0) {
                let prevTDay = '';
                list.forEach((b, idx) => {
                    const tInfo = getFuturesTradingDay(b.dateStr);
                    b.tradingDay = tInfo.tradingDay;
                    b.tradingDayLabel = tInfo.shortLabel;
                    if (idx === 0) {
                        b.isDayStart = true;
                        prevTDay = b.tradingDay;
                    } else if (b.tradingDay !== prevTDay) {
                        b.isDayStart = true;
                        prevTDay = b.tradingDay;
                    } else {
                        b.isDayStart = false;
                    }
                });
            }

            return list;
        }

        // 仅在本地 Canvas 上极速重绘分时与 Overview (0ms 超流畅，绝对不累加 scale)
        function redrawTrendCanvasOnly() {
            if (currentChartType !== 'trend') return;
            const canvas = document.getElementById('pro-chart-canvas');
            const container = document.getElementById('chart-wrapper');
            if (!canvas || !container) return;
            const dpr = window.devicePixelRatio || 1;
            const w = container.clientWidth || 1040;
            const h = container.clientHeight || 520;
            const expW = Math.round(w * dpr);
            const expH = Math.round(h * dpr);
            if (canvas.width !== expW || canvas.height !== expH) {
                canvas.width = expW;
                canvas.height = expH;
                canvas.style.width = w + 'px';
                canvas.style.height = h + 'px';
            }
            const ctx = canvas.getContext('2d');
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
            renderTrendCanvasDirect(ctx, w, h);
        }

        // 绘制多日分时图与 Overview 时间迷你滑块
        async function drawTrendChart(ctx, w, h) {
            const secid = activeModalSecId;
            const symbol = getSinaFuturesSymbol(activeModalSecId, activeModalQuote ? activeModalQuote.code : '');

            if (cachedTrendSymbol !== (secid || symbol) || !cachedTrendFullBars || cachedTrendFullBars.length === 0) {
                cachedTrendFullBars = await loadMultiDayTrendBars(secid, symbol);
                cachedTrendSymbol = (secid || symbol);

                // 初始默认视口：聚焦在「昨天后半段 + 今天全天时段框架(含未来留白)」
                const N_data = cachedTrendFullBars.length;
                if (N_data > 0) {
                    const sessionConfig = getFuturesSessionConfig(activeModalQuote ? activeModalQuote.code : '', activeModalSecId);
                    const lastBar = cachedTrendFullBars[N_data - 1];
                    const curSlot = convertTimeToSlotIndex(lastBar.time, sessionConfig);
                    const remainingSlots = Math.max(0, sessionConfig.totalMinutes - curSlot);
                    const minBreathingSlots = Math.round(sessionConfig.totalMinutes * 0.12);
                    const futurePaddingUnits = Math.max(minBreathingSlots, Math.round(remainingSlots * 0.85));
                    const N_universe = N_data + futurePaddingUnits;

                    // 默认视口宽度：约 1.35 个交易日跨度 (涵盖昨天下午盘 + 今天全天及预留空白)
                    const targetSpanUnits = Math.min(N_universe, Math.max(260, Math.round(sessionConfig.totalMinutes * 1.35)));
                    const defaultSpan = Math.min(0.65, Math.max(0.18, targetSpanUnits / N_universe));
                    trendViewEndRatio = 1.0;
                    trendViewStartRatio = Math.max(0, 1.0 - defaultSpan);
                } else {
                    trendViewStartRatio = 0.6;
                    trendViewEndRatio = 1.0;
                }
            }

            renderTrendCanvasDirect(ctx, w, h);
            return cachedTrendFullBars.length;
        }

        function renderTrendCanvasDirect(ctx, w, h) {
            ctx.clearRect(0, 0, w, h);

            if (!cachedTrendFullBars || cachedTrendFullBars.length === 0) {
                ctx.fillStyle = '#8b9db7';
                ctx.font = '14px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText('暂无分时数据或休市中', w / 2, h / 2);
                return;
            }

            const m = getChartMetrics(w);
            const FONT = (m.mobile ? '11px' : '10px') + ' var(--font-mono, monospace)';
            const sessionConfig = getFuturesSessionConfig(activeModalQuote ? activeModalQuote.code : '', activeModalSecId);

            // 1. 尺寸与分层布局 (自底向上：Overview -> 时间轴 -> 主图)
            const overviewH = m.mobile ? 24 : 28;
            const overviewBottom = h - 6;
            const overviewTop = overviewBottom - overviewH;

            const timeAxisH = m.mobile ? 20 : 18;
            const timeAxisBottom = overviewTop - 4;
            const timeAxisTop = timeAxisBottom - timeAxisH;

            const chartAvailableH = timeAxisTop;
            const mainH = chartAvailableH * 0.72;
            const volTop = mainH + 8;
            const volH = chartAvailableH - volTop;
            const volBottom = chartAvailableH;

            const padL = 6;
            const padR = 8;
            const availW = w - padL - padR;

            // 2. 连续统一宇宙时间轴建模 (历史多日真实点数 + 今日剩余交易/呼吸留白)
            const N_data = cachedTrendFullBars.length;
            const lastBar = cachedTrendFullBars[N_data - 1];
            const curSlot = convertTimeToSlotIndex(lastBar.time, sessionConfig);
            const remainingSlots = Math.max(0, sessionConfig.totalMinutes - curSlot);
            const minBreathingSlots = Math.round(sessionConfig.totalMinutes * 0.12);
            const futurePaddingUnits = Math.max(minBreathingSlots, Math.round(remainingSlots * 0.85));

            // 全宇宙时间轴总单元数
            const N_universe = N_data + futurePaddingUnits;

            // 视口浮动窗口在连续宇宙中的线性映射范围 [vStart, vEnd]
            const vStart = trendViewStartRatio * (N_universe - 1);
            const vEnd = trendViewEndRatio * (N_universe - 1);
            const vSpan = Math.max(10, vEnd - vStart);

            function getBarX(uIdx) {
                return padL + ((uIdx - vStart) / vSpan) * availW;
            }

            // 切片处于视口可见物理范围内的实体数据条目 (左右预留 2 根缓冲确保曲线边缘连续)
            const sIdx = Math.max(0, Math.floor(vStart - 2));
            const eIdx = Math.min(N_data - 1, Math.ceil(vEnd + 2));
            const visibleBars = (sIdx <= eIdx) ? cachedTrendFullBars.slice(sIdx, eIdx + 1) : [];

            if (visibleBars.length === 0) return;

            // 计算各可见条目的实体全局时间轴索引与画布 X 物理坐标
            visibleBars.forEach((b, idx) => {
                b.uIdx = sIdx + idx;
                b._x = getBarX(b.uIdx);
            });

            // 3. 价格极值与基准线判断 (当视口涵盖最新价及今日未走时段时，保持昨结基准居中)
            const isAtLatest = (vEnd >= N_data - 1);
            let prePrice = 0;
            if (cachedTrendOfficialPrePrice && cachedTrendOfficialPrePrice > 0) {
                prePrice = cachedTrendOfficialPrePrice;
            } else if (activeModalQuote && activeModalQuote.price > 0 && typeof activeModalQuote.change === 'number') {
                prePrice = activeModalQuote.price - activeModalQuote.change;
            }
            if (!prePrice || prePrice <= 0) {
                prePrice = (activeModalQuote && activeModalQuote.prevSettle > 0) ? activeModalQuote.prevSettle : visibleBars[0].price;
            }

            const prices = visibleBars.map(b => b.price);
            const minP = Math.min(...prices);
            const maxP = Math.max(...prices);

            let topP, botP;
            if (isAtLatest) {
                // 观察最新交易日时段：严格以昨结 prePrice 为中轴对称展开，0.00% 居中
                const diff = Math.max(Math.abs(maxP - prePrice), Math.abs(prePrice - minP)) || 1;
                topP = prePrice + diff * 1.06;
                botP = prePrice - diff * 1.06;
            } else {
                // 漫游历史时期：自动按当前视口极值自适应展开
                const pDiff = (maxP - minP) || 1;
                topP = maxP + pDiff * 0.08;
                botP = minP - pDiff * 0.08;
            }

            function getY(p) {
                return mainH - ((p - botP) / (topP - botP)) * mainH;
            }

            // 4. 独立时间轴底色与隔离线
            ctx.fillStyle = '#080c12';
            ctx.fillRect(0, chartAvailableH, w, timeAxisH);
            ctx.strokeStyle = '#1a2738';
            ctx.lineWidth = m.lwAxis;
            ctx.beginPath();
            ctx.moveTo(0, chartAvailableH);
            ctx.lineTo(w, chartAvailableH);
            ctx.stroke();

            // 5. 主图水平价格网格与涨跌幅刻度
            ctx.strokeStyle = '#16202e';
            ctx.lineWidth = m.lwAxis;
            for (let i = 0; i <= 4; i++) {
                const y = (mainH / 4) * i;
                ctx.beginPath();
                ctx.moveTo(0, y);
                ctx.lineTo(w, y);
                ctx.stroke();

                const curP = topP - ((topP - botP) / 4) * i;
                const changeRatio = prePrice > 0 ? ((curP - prePrice) / prePrice) * 100 : 0;
                ctx.fillStyle = changeRatio > 0.01 ? '#f85149' : changeRatio < -0.01 ? '#2ea043' : '#8b9db7';
                ctx.font = FONT;
                ctx.textAlign = 'right';
                ctx.fillText(`${curP.toFixed(1)} (${changeRatio >= 0 ? '+' : ''}${changeRatio.toFixed(2)}%)`, w - 8, y - 4);
            }

            // 昨结中轴基准虚线
            const zeroY = getY(prePrice);
            ctx.strokeStyle = '#3e4c63';
            ctx.setLineDash([4, 4]);
            ctx.beginPath();
            ctx.moveTo(0, zeroY);
            ctx.lineTo(w, zeroY);
            ctx.stroke();
            ctx.setLineDash([]);

            // 6. 交易日分界线与时间轴标签 (垂直虚线贯穿，时间轴清晰标注如 10/22 四)
            visibleBars.forEach((b) => {
                if (b.isDayStart && b.uIdx > 0 && b._x >= padL - 10 && b._x <= padL + availW + 10) {
                    ctx.strokeStyle = '#2b3d54';
                    ctx.lineWidth = 1.0;
                    ctx.setLineDash([3, 3]);
                    ctx.beginPath();
                    ctx.moveTo(b._x, 0);
                    ctx.lineTo(b._x, chartAvailableH);
                    ctx.stroke();
                    ctx.setLineDash([]);

                    ctx.fillStyle = '#58a6ff';
                    ctx.font = FONT;
                    ctx.textAlign = 'center';
                    ctx.fillText(b.tradingDayLabel || b.date, b._x, chartAvailableH + 14);
                }
            });

            // 7. 价格走势半透明渐变底色 (按交易日独立成段，断开跨日空白)
            const dayChunks = [];
            let curChunk = [];
            visibleBars.forEach(d => {
                if (d.isDayStart && curChunk.length > 0) {
                    dayChunks.push(curChunk);
                    curChunk = [];
                }
                curChunk.push(d);
            });
            if (curChunk.length > 0) dayChunks.push(curChunk);

            const grad = ctx.createLinearGradient(0, 0, 0, mainH);
            grad.addColorStop(0, 'rgba(56, 139, 253, 0.18)');
            grad.addColorStop(1, 'rgba(56, 139, 253, 0.01)');

            dayChunks.forEach(chunk => {
                if (chunk.length < 2) return;
                const firstX = chunk[0]._x;
                const lastX = chunk[chunk.length - 1]._x;
                ctx.beginPath();
                ctx.moveTo(firstX, zeroY);
                chunk.forEach(d => {
                    ctx.lineTo(d._x, getY(d.price));
                });
                ctx.lineTo(lastX, zeroY);
                ctx.closePath();
                ctx.fillStyle = grad;
                ctx.fill();
            });

            // 8. VWAP 均价黄线 (交易所官方分时成交均价，跨日断开，绝不拉斜线连接)
            ctx.beginPath();
            ctx.strokeStyle = '#f1c40f';
            ctx.lineWidth = m.lwMA;
            visibleBars.forEach((d, idx) => {
                const y = getY(d.vwap > 0 ? d.vwap : d.price);
                if (idx === 0 || d.isDayStart) ctx.moveTo(d._x, y);
                else ctx.lineTo(d._x, y);
            });
            ctx.stroke();

            // 9. 价格白线 (主走势，跨日断开，绝不拉斜线连接)
            ctx.beginPath();
            ctx.strokeStyle = '#f0f6fc';
            ctx.lineWidth = m.mobile ? 2.2 : 1.8;
            visibleBars.forEach((d, idx) => {
                const y = getY(d.price);
                if (idx === 0 || d.isDayStart) ctx.moveTo(d._x, y);
                else ctx.lineTo(d._x, y);
            });
            ctx.stroke();

            // 10. 最新价呼吸圆点与横向指示线 (仅当最新点处于画布物理宽度范围内时绘制)
            const lastBarX = getBarX(N_data - 1);
            const lastBarY = getY(lastBar.price);

            if (lastBarX >= padL && lastBarX <= padL + availW) {
                // 水平虚线向右延伸贯穿呼吸留白区
                ctx.strokeStyle = lastBar.price >= prePrice ? '#f85149' : '#2ea043';
                ctx.setLineDash([2, 2]);
                ctx.beginPath();
                ctx.moveTo(lastBarX, lastBarY);
                ctx.lineTo(padL + availW, lastBarY);
                ctx.stroke();
                ctx.setLineDash([]);

                // 最新价实体呼吸圆点
                ctx.beginPath();
                ctx.arc(lastBarX, lastBarY, 3.5, 0, Math.PI * 2);
                ctx.fillStyle = '#ffffff';
                ctx.fill();
                ctx.lineWidth = 1.5;
                ctx.strokeStyle = lastBar.price >= prePrice ? '#f85149' : '#2ea043';
                ctx.stroke();
            }

            // 11. 成交量副图 (红涨绿跌，标准金融规则)
            const maxVol = Math.max(...visibleBars.map(d => d.vol)) || 1;
            const barW = Math.max(1, Math.min(4, (availW / vSpan) * 0.85));
            visibleBars.forEach((d, idx) => {
                if (d._x < padL - 4 || d._x > padL + availW + 4) return;
                const bH = (d.vol / maxVol) * volH;
                let isUp = true;
                if (d.uIdx === 0) {
                    isUp = d.price >= prePrice;
                } else {
                    const prevBar = cachedTrendFullBars[d.uIdx - 1];
                    const prevP = prevBar ? prevBar.price : prePrice;
                    if (d.price > prevP) isUp = true;
                    else if (d.price < prevP) isUp = false;
                    else isUp = (idx > 0 && visibleBars[idx - 1].isUp !== undefined) ? visibleBars[idx - 1].isUp : true;
                }
                d.isUp = isUp;
                ctx.fillStyle = isUp ? '#f85149' : '#2ea043';
                ctx.fillRect(d._x - barW / 2, volBottom - bH, barW, bH);
            });

            // 12. 底部 TradingView 风格 Overview 迷你小地图绘制 (映射至统一连续的大时间轴 N_universe)
            const allBars = cachedTrendFullBars;
            if (allBars && allBars.length > 1) {
                // 底槽背景与边框
                ctx.fillStyle = '#070b10';
                ctx.fillRect(padL, overviewTop, availW, overviewH);
                ctx.strokeStyle = '#182433';
                ctx.lineWidth = 1;
                ctx.strokeRect(padL, overviewTop, availW, overviewH);

                // 全景缩略折线 (跨日断开，基于 N_universe 连续空间投影)
                const allP = allBars.map(b => b.price);
                const aMin = Math.min(...allP);
                const aMax = Math.max(...allP);
                const aDiff = (aMax - aMin) || 1;

                ctx.beginPath();
                ctx.strokeStyle = 'rgba(88, 166, 255, 0.60)';
                ctx.lineWidth = 1.1;
                for (let i = 0; i < allBars.length; i++) {
                    const ox = padL + (i / (N_universe - 1)) * availW;
                    const normY = (allBars[i].price - aMin) / aDiff;
                    const oy = (overviewBottom - 3) - normY * (overviewH - 6);
                    if (i === 0 || allBars[i].isDayStart) ctx.moveTo(ox, oy);
                    else ctx.lineTo(ox, oy);
                }
                ctx.stroke();

                // 在 Overview 上标注日分界虚线
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.15)';
                ctx.lineWidth = 1;
                for (let i = 1; i < allBars.length; i++) {
                    if (allBars[i].isDayStart) {
                        const ox = padL + (i / (N_universe - 1)) * availW;
                        ctx.beginPath();
                        ctx.moveTo(ox, overviewTop);
                        ctx.lineTo(ox, overviewBottom);
                        ctx.stroke();
                    }
                }

                // 视口选框坐标
                const vx1 = padL + trendViewStartRatio * availW;
                const vx2 = padL + trendViewEndRatio * availW;
                const vWidth = Math.max(12, vx2 - vx1);

                // 左右两侧暗色遮罩
                ctx.fillStyle = 'rgba(5, 9, 15, 0.75)';
                if (vx1 > padL) {
                    ctx.fillRect(padL, overviewTop, vx1 - padL, overviewH);
                }
                if (vx2 < padL + availW) {
                    ctx.fillRect(vx2, overviewTop, (padL + availW) - vx2, overviewH);
                }

                // 激活视口框 (高亮蓝边 + 微弱半透明填充)
                ctx.fillStyle = 'rgba(56, 139, 253, 0.18)';
                ctx.fillRect(vx1, overviewTop, vWidth, overviewH);
                ctx.strokeStyle = '#58a6ff';
                ctx.lineWidth = 1.5;
                ctx.strokeRect(vx1, overviewTop, vWidth, overviewH);

                // 左右调节把手
                const handleW = 5;
                ctx.fillStyle = '#79c0ff';
                ctx.fillRect(vx1, overviewTop + 3, handleW, overviewH - 6);
                ctx.fillRect(vx2 - handleW, overviewTop + 3, handleW, overviewH - 6);

                // 缓存 Overview 几何位置
                trendOverviewRect = {
                    x: padL,
                    y: overviewTop,
                    w: availW,
                    h: overviewH,
                    vx1,
                    vx2
                };
            }

            // 13. 缓存给鼠标与触控十字光标联动
            activeTrendData = {
                visibleBars,
                getX: (b) => b._x,
                prePrice,
                padL,
                availW
            };
        }
            };
        }

        // 绘制多周期 K 线图 (新浪 1023 根真实多日历史数据库，初始化精准截取 150 根/80 根)
        async function drawKlineChart(ctx, w, h, klt, reqLimit) {
            const symbol = getSinaFuturesSymbol(activeModalSecId, activeModalQuote ? activeModalQuote.code : '');
            cachedFullKlines = [];

            try {
                let kUrl = '';
                if (klt === '101') {
                    kUrl = `https://stock2.finance.sina.com.cn/futures/api/jsonp.php/var%20CALLBACK_VAR=/InnerFuturesNewService.getDailyKLine?symbol=${symbol}`;
                } else {
                    kUrl = `https://stock2.finance.sina.com.cn/futures/api/jsonp.php/var%20CALLBACK_VAR=/InnerFuturesNewService.getFewMinLine?symbol=${symbol}&type=${klt}`;
                }

                const rawArr = await loadSinaFuturesJsonp(kUrl);
                if (rawArr && Array.isArray(rawArr) && rawArr.length > 0) {
                    cachedFullKlines = rawArr.map(item => ({
                        date: item.d || '',
                        open: parseFloat(item.o) || 0,
                        high: parseFloat(item.h) || 0,
                        low: parseFloat(item.l) || 0,
                        close: parseFloat(item.c) || 0,
                        vol: parseInt(item.v) || 0
                    })).filter(k => k.close > 0 && k.high >= k.low);
                }
            } catch(e) {
                console.error('Draw Kline error:', e);
            }

            if (!cachedFullKlines || cachedFullKlines.length === 0) {
                ctx.fillStyle = '#8b9db7';
                ctx.font = '14px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText('暂无该真实合约的 K 线数据', w / 2, h / 2);
                return 0;
            }

            // 初始化当前视口展示根数
            currentVisibleCount = Math.min(reqLimit, cachedFullKlines.length);
            chartViewStart = 0;           // 新数据加载后重置平移位置
            return redrawKlineCanvasOnly();
        }

        // 本地极速 0ms 重绘 K 线 (缩放、切帧不发网络请求)
        function redrawKlineCanvasOnly() {
            if (!activeModalSecId || currentChartType === 'trend' || !cachedFullKlines || cachedFullKlines.length === 0) return 0;

            const canvas = document.getElementById('pro-chart-canvas');
            const container = document.getElementById('chart-wrapper');
            const dpr = window.devicePixelRatio || 1;
            const w = (container && container.clientWidth) ? container.clientWidth : 1040;
            const h = (container && container.clientHeight) ? container.clientHeight : 520;
            canvas.width = Math.round(w * dpr);
            canvas.height = Math.round(h * dpr);
            canvas.style.width = w + 'px';
            canvas.style.height = h + 'px';

            const ctx = canvas.getContext('2d');
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
            ctx.clearRect(0, 0, w, h);

            // 截取当前视口可见的 K 线子集（支持触控平移 chartViewStart，强健容错防御 NaN）
            const total = cachedFullKlines.length;
            if (!Number.isFinite(chartViewStart) || chartViewStart < 0) chartViewStart = 0;
            if (!Number.isFinite(currentVisibleCount) || currentVisibleCount < 10) currentVisibleCount = Math.min(60, total);
            chartViewStart = Math.min(Math.max(0, total - currentVisibleCount), chartViewStart);

            let _start = total - currentVisibleCount - chartViewStart;
            let _end = _start + currentVisibleCount;
            if (_end > total) { _end = total; _start = Math.max(0, _end - currentVisibleCount); }
            if (_start < 0) _start = 0;
            const visibleBars = cachedFullKlines.slice(_start, _end);
            const count = visibleBars.length;
            if (count === 0) return 0;

            // 移动端线宽 / 字体制表：手机上把线加粗、字放大，避免看不清
            const m = getChartMetrics(w);
            const FONT = (m.mobile ? '12px' : '10px') + ' monospace';

            // 计算均线 MA5, MA10, MA20
            for (let i = 0; i < count; i++) {
                visibleBars[i].ma5 = calcMA(visibleBars, i, 5);
                visibleBars[i].ma10 = calcMA(visibleBars, i, 10);
                visibleBars[i].ma20 = calcMA(visibleBars, i, 20);
            }

            const highs = visibleBars.map(k => k.high);
            const lows = visibleBars.map(k => k.low);
            const maxP = Math.max(...highs);
            const minP = Math.min(...lows);
            const pad = (maxP - minP) * 0.08 || 1;
            const topP = maxP + pad;
            const botP = minP - pad;

            // 独立时间轴布局 (彻底隔离成交量副图与时间轴)
            const timeAxisH = m.timeAxisH;
            const chartAvailableH = h - timeAxisH;
            const mainH = chartAvailableH * 0.72;
            const volTop = mainH + 12;
            const volH = chartAvailableH - volTop;
            const volBottom = chartAvailableH;

            const step = w / count;
            const barWidth = Math.max(m.barWMin, Math.min(m.barWMax, step * m.barWRatio));

            // 绘制独立时间轴底色与顶部分隔线 (彻底隔绝红绿成交量柱)
            ctx.fillStyle = '#080c12';
            ctx.fillRect(0, chartAvailableH, w, timeAxisH);
            ctx.strokeStyle = '#1a2738';
            ctx.lineWidth = m.lwAxis;
            ctx.beginPath();
            ctx.moveTo(0, chartAvailableH);
            ctx.lineTo(w, chartAvailableH);
            ctx.stroke();

            // 网格线与价格刻度
            ctx.strokeStyle = '#1a2332';
            ctx.lineWidth = m.lwAxis;
            for (let i = 0; i <= 4; i++) {
                const y = (mainH / 4) * i;
                ctx.beginPath();
                ctx.moveTo(0, y);
                ctx.lineTo(w, y);
                ctx.stroke();

                const curP = topP - ((topP - botP) / 4) * i;
                ctx.fillStyle = '#8b9db7';
                ctx.font = FONT;
                ctx.textAlign = 'right';
                ctx.fillText(curP.toFixed(1), w - 8, y - 4);
            }

            // 寻找【今日交易开始点】(仅在分钟图绘制，日线不绘制)
            const isDay = (currentChartType === '101');
            const isMinuteChart = !isDay;
            const latestDate = visibleBars[count - 1].date.split(' ')[0];
            let todayStartIndex = -1;

            if (isMinuteChart) {
                for (let i = 0; i < count; i++) {
                    if (visibleBars[i].date.split(' ')[0] === latestDate) {
                        todayStartIndex = i;
                        break;
                    }
                }

                if (todayStartIndex > 0) {
                    const todayStartX = todayStartIndex * step;
                    ctx.fillStyle = 'rgba(56, 139, 253, 0.04)';
                    ctx.fillRect(todayStartX, 0, w - todayStartX, chartAvailableH);
                }
            }

            // 绘制各交易日分界线与最新时段分割线 (清爽精简，仅保留单根细金分割线与日/夜盘标识)
            let prevDay = '';
            let lastLabelX = -999;

            visibleBars.forEach((k, idx) => {
                const dayStr = k.date.split(' ')[0];
                const x = idx * step;
                if (prevDay && dayStr !== prevDay && isMinuteChart) {
                    const isTodayDivider = (dayStr === latestDate);

                    if (isTodayDivider) {
                        // 最新时段黄金分割虚线 (通透清爽，无遮挡)
                        ctx.strokeStyle = '#e3b341';
                        ctx.lineWidth = m.lwDivider;
                        ctx.setLineDash([4, 3]);
                        ctx.beginPath();
                        ctx.moveTo(x, 0);
                        ctx.lineTo(x, chartAvailableH);
                        ctx.stroke();
                        ctx.setLineDash([]);

                        // 识别开盘时段 (日盘 / 夜盘)
                        let session = '';
                        if (k.date.includes(' ')) {
                            const hour = parseInt(k.date.split(' ')[1].split(':')[0]);
                            session = (hour >= 20 || hour < 4) ? '夜盘' : (hour >= 8 && hour < 16) ? '日盘' : '';
                        }
                        const labelText = session ? `${dayStr.substring(5)} ${session}` : dayStr.substring(5);

                        // 底部时间轴金标正常显示日期与时段
                        ctx.fillStyle = '#e3b341';
                        ctx.font = 'bold ' + FONT;
                        ctx.textAlign = 'center';
                        ctx.fillText(labelText, x, chartAvailableH + 15);
                        lastLabelX = x + 35;
                    } else {
                        // 历史各交易日分界线 (极细暗色虚线)
                        ctx.strokeStyle = '#162232';
                        ctx.lineWidth = m.lwAxis;
                        ctx.setLineDash([2, 4]);
                        ctx.beginPath();
                        ctx.moveTo(x, 0);
                        ctx.lineTo(x, chartAvailableH);
                        ctx.stroke();
                        ctx.setLineDash([]);

                        // 智能防重叠抽稀算法：仅当水平间距足够时才绘制日期文字
                        if (x - lastLabelX >= (m.mobile ? 50 : 65) && w - x >= 30 && x >= 25) {
                            ctx.fillStyle = '#58a6ff';
                            ctx.font = FONT;
                            ctx.textAlign = 'center';
                            ctx.fillText(dayStr.substring(5), x, chartAvailableH + 15);
                            lastLabelX = x;
                        }
                    }
                }
                prevDay = dayStr;
            });

            // 日K线 (101) 的自适应时间轴刻度
            if (isDay) {
                let lastDayLabelX = -999;
                visibleBars.forEach((k, idx) => {
                    const x = idx * step + step / 2;
                    if (x - lastDayLabelX >= (m.mobile ? 55 : 70) && w - x >= 30 && x >= 25) {
                        ctx.fillStyle = '#58a6ff';
                        ctx.font = FONT;
                        ctx.textAlign = 'center';
                        ctx.fillText(k.date.substring(5), x, chartAvailableH + 15);
                        lastDayLabelX = x;
                    }
                });
            }

            // 绘制 K 柱与影线 (主图区域：空心阳线 + 实心阴线，清爽透气，彻底消除拥挤感)
            visibleBars.forEach((k, idx) => {
                const x = idx * step + step / 2;
                const isUp = k.close >= k.open;
                const isDoji = Math.abs(k.close - k.open) < 0.0001;

                const yOpen = mainH - ((k.open - botP) / (topP - botP)) * mainH;
                const yClose = mainH - ((k.close - botP) / (topP - botP)) * mainH;
                const yHigh = mainH - ((k.high - botP) / (topP - botP)) * mainH;
                const yLow = mainH - ((k.low - botP) / (topP - botP)) * mainH;

                const topY = Math.min(yOpen, yClose);
                const bHeight = Math.max(1.5, Math.abs(yOpen - yClose));
                const bx = x - barWidth / 2;

                if (isUp && !isDoji) {
                    // ===== 空心阳线 (Hollow Red Candle) =====
                    // 1. 底色填充，干净隔绝背景网格与均线
                    ctx.fillStyle = '#080c12';
                    ctx.fillRect(bx, topY, barWidth, bHeight);

                    // 2. 红色空心边框
                    ctx.strokeStyle = '#f85149';
                    ctx.lineWidth = m.lwWick;
                    ctx.strokeRect(bx, topY, barWidth, bHeight);

                    // 3. 影线：上影线连接最高点至实体顶端，下影线连接实体底端至最低点（不穿透中空体）
                    ctx.beginPath();
                    if (yHigh < topY) {
                        ctx.moveTo(x, yHigh);
                        ctx.lineTo(x, topY);
                    }
                    if (yLow > topY + bHeight) {
                        ctx.moveTo(x, topY + bHeight);
                        ctx.lineTo(x, yLow);
                    }
                    ctx.stroke();
                } else if (isDoji) {
                    // 十字星 (平盘线)
                    ctx.strokeStyle = '#8b9db7';
                    ctx.lineWidth = m.lwWick;
                    ctx.beginPath();
                    ctx.moveTo(x, yHigh);
                    ctx.lineTo(x, yLow);
                    ctx.moveTo(bx, topY);
                    ctx.lineTo(bx + barWidth, topY);
                    ctx.stroke();
                } else {
                    // ===== 实心阴线 (Solid Green Candle) =====
                    ctx.strokeStyle = '#2ea043';
                    ctx.lineWidth = m.lwWick;
                    ctx.beginPath();
                    ctx.moveTo(x, yHigh);
                    ctx.lineTo(x, yLow);
                    ctx.stroke();

                    ctx.fillStyle = '#2ea043';
                    ctx.fillRect(bx, topY, barWidth, bHeight);
                }
            });

            // 均线绘制
            function drawMALine(key, color) {
                ctx.beginPath();
                ctx.strokeStyle = color;
                ctx.lineWidth = m.lwMA;
                let started = false;
                visibleBars.forEach((k, idx) => {
                    if (k[key]) {
                        const x = idx * step + step / 2;
                        const y = mainH - ((k[key] - botP) / (topP - botP)) * mainH;
                        if (!started) { ctx.moveTo(x, y); started = true; }
                        else ctx.lineTo(x, y);
                    }
                });
                ctx.stroke();
            }

            drawMALine('ma5', '#f1c40f');
            drawMALine('ma10', '#9b59b6');
            drawMALine('ma20', '#3498db');

            // 成交量副图 (严格绘制在 volTop 与 volBottom 之间，绝不与时间轴文字撞车)
            const maxVol = Math.max(...visibleBars.map(k => k.vol)) || 1;
            visibleBars.forEach((k, idx) => {
                const x = idx * step + step / 2;
                const bH = Math.max(1, (k.vol / maxVol) * volH);
                const isUp = k.close >= k.open;
                const bx = x - barWidth / 2;
                if (isUp) {
                    ctx.fillStyle = '#080c12';
                    ctx.fillRect(bx, volBottom - bH, barWidth, bH);
                    ctx.strokeStyle = '#f85149';
                    ctx.lineWidth = m.lwWick;
                    ctx.strokeRect(bx, volBottom - bH, barWidth, bH);
                } else {
                    ctx.fillStyle = '#2ea043';
                    ctx.fillRect(bx, volBottom - bH, barWidth, bH);
                }
            });

            // 挂载鼠标悬停十字光标事件
            activeRenderData = { klines: visibleBars, step, topP, botP, mainH, h, w };
            bindCanvasHover(canvas);

            updateChartLegendText();
            return visibleBars.length;
        }

        function updateChartLegendText() {
            const legendEl = document.getElementById('chart-legend');
            if (!legendEl || !activeModalSecId) return;

            if (currentChartType === 'trend') {
                const benchP = (activeModalQuote && activeModalQuote.price > 0 && typeof activeModalQuote.change === 'number')
                    ? (activeModalQuote.price - activeModalQuote.change).toFixed(1)
                    : (activeModalQuote && activeModalQuote.prevSettle > 0 ? activeModalQuote.prevSettle.toFixed(1) : '--');

                legendEl.innerHTML = `
                    <div class="legend-item"><span class="legend-dot" style="background:#f0f6fc;"></span><span>实时价格白线</span></div>
                    <div class="legend-item"><span class="legend-dot" style="background:#f1c40f;"></span><span>均价线 (VWAP)</span></div>
                    <div class="legend-item"><span class="legend-dot" style="background:#6e839e;"></span><span>昨结基准: ${benchP}</span></div>
                `;
            } else {
                const kName = currentChartType === '5' ? '5分钟K' :
                              currentChartType === '15' ? '15分钟K' :
                              currentChartType === '60' ? '60分钟K' : '日K线';
                const totalLoaded = cachedFullKlines ? cachedFullKlines.length : 0;
                legendEl.innerHTML = `
                    <div class="legend-item"><span style="color:#58a6ff; font-weight:bold;">${kName} (当前展示 ${currentVisibleCount} 根 / 共 ${totalLoaded} 根)</span></div>
                    <div class="legend-item"><span class="legend-dot" style="background:#f1c40f;"></span><span>MA5</span></div>
                    <div class="legend-item"><span class="legend-dot" style="background:#9b59b6;"></span><span>MA10</span></div>
                    <div class="legend-item"><span class="legend-dot" style="background:#3498db;"></span><span>MA20</span></div>
                `;
            }
        }

        // 鼠标悬停实时展示 K 柱详情
        let hoverBound = false;
        function bindCanvasHover(canvas) {
            if (hoverBound) return;
            hoverBound = true;

            canvas.addEventListener('mousemove', (e) => {
                if (!activeRenderData || currentChartType === 'trend') return;
                const rect = canvas.getBoundingClientRect();
                const mouseX = e.clientX - rect.left;
                const { klines, step } = activeRenderData;
                const idx = Math.floor(mouseX / step);
                if (idx >= 0 && idx < klines.length) {
                    const k = klines[idx];
                    const isUp = k.close >= k.open;
                    const infoEl = document.getElementById('chart-status-text');
                    if (infoEl) {
                        infoEl.innerHTML = `
                            <span>${k.date}</span> | 
                            <span>开: ${k.open}</span> 
                            <span>高: ${k.high}</span> 
                            <span>低: ${k.low}</span> 
                            <span style="color:${isUp ? '#f85149':'#2ea043'}; font-weight:bold;">收: ${k.close}</span> | 
                            <span>量: ${k.vol}手</span>
                        `;
                    }
                }
            });

            canvas.addEventListener('mouseleave', () => {
                const infoEl = document.getElementById('chart-status-text');
                if (infoEl && activeRenderData) {
                    infoEl.innerHTML = `✅ 已成功加载 ${activeRenderData.klines.length} 根 K 柱 (移动光标查看具体明细)`;
                }
            });
        }

        function calcMA(list, idx, n) {
            if (idx < n - 1) return null;
            let sum = 0;
            for (let i = idx - n + 1; i <= idx; i++) sum += list[i].close;
            return sum / n;
        }

        // ==================== PWA Service Worker 注册与桌面化安装支持 ====================
        let deferredPwaPrompt = null;
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js').then((reg) => {
                    console.log('[PWA] Service Worker 已成功运行在域:', reg.scope);
                }).catch((err) => {
                    console.warn('[PWA] Service Worker 注册被跳过:', err);
                });
            });
        }

        window.addEventListener('beforeinstallprompt', (e) => {
            // 阻止浏览器默认迷你横条，保留安装事件供用户按需触发
            e.preventDefault();
            deferredPwaPrompt = e;
            console.log('[PWA] 应用已就绪，支持一键添加到桌面/主屏幕');
        });

        // 提前压入守卫状态，保证无论脚本何时被评估均可拦截返回手势
        initPwaHistoryGuard();

        // 确保无论 DOM 何时就绪都能稳定启动 init（兼顾 PWA / Webview / 缓存即时启动）
        if (document.readyState === 'loading') {
            window.addEventListener('DOMContentLoaded', init);
        } else {
            init();
        }
    </script>

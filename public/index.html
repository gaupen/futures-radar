<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>期货真实交割合约异动雷达 | Futures Physical Terminal</title>

    <!-- PWA & Mobile Web App 核心规范 -->
    <meta name="description" content="国内商品期货真实交割合约多维异动雷达与移动端实时监控终端">
    <meta name="theme-color" content="#0f172a">
    <meta name="color-scheme" content="dark">

    <!-- Web App Manifest -->
    <link rel="manifest" href="/manifest.webmanifest">

    <!-- Apple iOS Safari 原生全屏桌面化适配 -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="期货雷达">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <link rel="icon" type="image/svg+xml" href="/icon.svg">
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
    <style>
        :root {
            --bg-primary: #070b10;
            --bg-card: #0e1520;
            --bg-card-hover: #152233;
            --bg-modal: #0b121b;
            --border-color: #213247;
            --border-highlight: #3b5577;
            --text-primary: #ffffff;
            --text-secondary: #a3b5ce;
            --text-muted: #6e839e;
            --accent-color: #58a6ff;
            --accent-glow: rgba(88, 166, 255, 0.35);
            --up-color: #ff5c52;
            --up-bg: rgba(255, 92, 82, 0.18);
            --down-color: #38c858;
            --down-bg: rgba(56, 200, 88, 0.18);
            --flat-color: #9cb1cc;
            --flat-bg: rgba(156, 177, 204, 0.12);
            --font-mono: 'Maple Mono NF CN', 'Sarasa Mono SC', 'Cascadia Code', Consolas, monospace;
            --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            overscroll-behavior: none;
            overscroll-behavior-x: none;
            overscroll-behavior-y: none;
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-primary);
            font-family: var(--font-sans);
            min-height: 100vh;
            padding: 14px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            overscroll-behavior: none;
            overscroll-behavior-x: none;
            overscroll-behavior-y: none;
            touch-action: pan-y; /* 仅允许纵向滚动，彻底屏蔽 Chromium 默认横向边界导航手势与滑动阻尼 */
        }

        /* 顶部极简紧凑顶栏 (40~42px，释放 70%+ 屏幕纵深) */
        .compact-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-bottom: none;
            padding: 6px 14px;
            border-radius: 8px 8px 0 0;
            min-height: 42px;
            gap: 10px;
            user-select: none;
        }

        .compact-header-left {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .compact-logo {
            font-size: 16px;
        }

        .compact-title {
            font-size: 15px;
            font-weight: 700;
            color: #58a6ff;
            letter-spacing: 0.3px;
            margin: 0;
            padding: 0;
        }

        .compact-header-right {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .compact-pill {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            background: #141e2b;
            border: 1px solid var(--border-color);
            padding: 3px 8px;
            border-radius: 6px;
            font-size: 12px;
            font-family: var(--font-mono);
            color: var(--text-secondary);
        }

        .pill-dot {
            font-size: 11px;
            line-height: 1;
        }

        .compact-icon-btn {
            background: #141e2b;
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 14px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
            min-height: 32px;
        }

        .compact-icon-btn:hover {
            background: #1f2d3f;
            border-color: var(--border-highlight);
        }

        .compact-icon-btn.active {
            background: #1f6feb;
            color: #ffffff;
            border-color: #388bfd;
            box-shadow: 0 0 8px rgba(31, 111, 235, 0.4);
        }

        /* 2px 极细发丝级倒计时进度条 (纯净极简，绝不晃眼) */
        .hairline-progress-track {
            width: 100%;
            height: 2px;
            background: #090e15;
            border-left: 1px solid var(--border-color);
            border-right: 1px solid var(--border-color);
            border-bottom: 1px solid var(--border-color);
            border-radius: 0 0 8px 8px;
            position: relative;
            overflow: hidden;
            margin-bottom: 2px;
        }

        .hairline-progress-fill {
            height: 100%;
            width: 100%;
            background: linear-gradient(90deg, #1f6feb 0%, #388bfd 65%, #58a6ff 100%);
            transition: width 1s linear;
        }

        /* 统计与状态徽章 */
        .stat-badge {
            padding: 3px 8px;
            border-radius: 5px;
            background: #141e2b;
            border: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            gap: 4px;
            font-family: var(--font-mono);
            font-size: 12px;
        }

        .stat-up { color: var(--up-color); font-weight: bold; }
        .stat-down { color: var(--down-color); font-weight: bold; }

        .select-control {
            background: #141e2b;
            color: var(--text-primary);
            border: 1px solid var(--border-color);
            padding: 5px 10px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 5px;
            outline: none;
        }

        .select-control:hover {
            background: #1c2b3d;
            border-color: var(--border-highlight);
        }

        /* 全局置顶涨跌幅门禁组 */
        .threshold-group {
            display: flex;
            align-items: center;
            gap: 4px;
            background: #090e15;
            padding: 2px 6px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            font-size: 11px;
            font-family: var(--font-mono);
        }

        .threshold-label {
            color: var(--text-muted);
            margin-right: 2px;
        }

        .threshold-chip {
            padding: 3px 7px;
            border-radius: 4px;
            cursor: pointer;
            color: var(--text-secondary);
            font-weight: 700;
            transition: all 0.2s ease;
        }

        .threshold-chip:hover {
            background: #1a2738;
            color: var(--text-primary);
        }

        .threshold-chip.active {
            background: #1f6feb;
            color: #ffffff;
            box-shadow: 0 0 6px rgba(56, 139, 253, 0.6);
        }

        .level2-badge {
            padding: 2px 9px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 700;
            background: #0d1a29;
            border: 1px solid #1f6feb;
            color: #58a6ff;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            transition: all 0.25s ease;
            font-family: var(--font-mono);
        }

        .level2-badge.flash {
            background: rgba(0, 242, 254, 0.25);
            border-color: #00f2fe;
            color: #ffffff;
            box-shadow: 0 0 12px rgba(0, 242, 254, 0.8), 0 0 4px #ffffff;
            transform: scale(1.08);
            animation: badgeFlashAnim 0.4s ease-out;
        }

        @keyframes badgeFlashAnim {
            0% { transform: scale(1); filter: brightness(1); }
            50% { transform: scale(1.15); filter: brightness(1.6); }
            100% { transform: scale(1.08); filter: brightness(1); }
        }

        .filter-summary-text {
            color: var(--text-secondary);
            font-size: 11px;
            font-family: var(--font-mono);
        }

        /* 可折叠设置抽屉面板 */
        .settings-drawer {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 12px 14px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
            margin-bottom: 6px;
            animation: drawerSlideDown 0.22s ease-out;
        }

        @keyframes drawerSlideDown {
            from { opacity: 0; transform: translateY(-8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .drawer-content {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .drawer-section {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .drawer-section-title {
            font-size: 11px;
            font-weight: 700;
            color: var(--text-muted);
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .drawer-row {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .drawer-stats {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .drawer-status-text {
            font-size: 11px;
            font-family: var(--font-mono);
            color: #58a6ff;
        }

        .drawer-footer-row {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 4px;
        }

        .drawer-source-banner {
            flex: 1;
            font-size: 11px;
            color: var(--text-secondary);
            padding: 5px 10px;
            border-radius: 6px;
            background: #141e2b;
            border: 1px solid var(--border-color);
        }

        .drawer-refresh-btn {
            flex: 0 0 auto;
            font-size: 12px;
            padding: 6px 14px;
            border-radius: 6px;
            cursor: pointer;
            background: #141e2b;
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            font-weight: 600;
            transition: all 0.2s ease;
        }

        .drawer-refresh-btn:hover {
            background: #1f2d3f;
            border-color: var(--border-highlight);
        }

        .progress-node-pin { display: none; }

        /* 异动雷达双Tab分类栏 (1:1等宽，纯粹极简) */
        .filter-bar {
            display: flex;
            align-items: center;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            padding: 4px;
            border-radius: 8px;
        }

        .dual-tab-group {
            display: flex;
            width: 100%;
            gap: 6px;
        }

        .dual-tab-group .tab-btn {
            flex: 1;
            text-align: center;
            padding: 8px 12px;
            font-size: 14px;
            font-weight: 700;
            border-radius: 6px;
            min-height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            border: 1px solid transparent;
            background: transparent;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.2s ease;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        .dual-tab-group .tab-btn:hover {
            background: #141e2b;
            color: var(--text-primary);
        }

        .dual-tab-group .tab-btn.active {
            background: #1f6feb;
            color: #ffffff;
            border-color: #388bfd;
            box-shadow: 0 0 10px rgba(31, 111, 235, 0.4);
        }

        /* 卡片内多月份胶囊标签栏 */
        .month-pills {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            margin-top: 4px;
            margin-bottom: 4px;
        }

        .month-pill {
            font-family: var(--font-mono);
            font-size: 11px;
            font-weight: 700;
            padding: 3px 8px;
            border-radius: 12px;
            background: #141e2b;
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.15s ease;
            display: inline-flex;
            align-items: center;
            gap: 3px;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            min-height: 26px;
        }

        .month-pill:hover {
            background: #1c2b3d;
            color: var(--text-primary);
            border-color: var(--border-highlight);
        }

        .month-pill.active {
            background: rgba(88, 166, 255, 0.22);
            color: #58a6ff;
            border-color: #58a6ff;
            box-shadow: 0 0 6px rgba(88, 166, 255, 0.35);
        }

        .month-pill.is-lead {
            font-weight: 800;
        }

        .month-pill.pill-up {
            color: var(--up-color);
        }
        .month-pill.pill-down {
            color: var(--down-color);
        }
        .month-pill.active.pill-up {
            background: var(--up-bg);
            border-color: var(--up-color);
            color: #ff7b72;
            box-shadow: 0 0 6px rgba(255, 92, 82, 0.4);
        }
        .month-pill.active.pill-down {
            background: var(--down-bg);
            border-color: var(--down-color);
            color: #56d364;
            box-shadow: 0 0 6px rgba(56, 200, 88, 0.4);
        }

        /* 卡片容器与卡片样式 */
        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 12px;
            width: 100%;
        }

        .card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 12px 14px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            transition: transform 0.15s ease, border-color 0.2s ease, box-shadow 0.2s ease;
            position: relative;
            cursor: pointer;
        }

        .card:hover {
            transform: translateY(-2px);
            border-color: var(--border-highlight);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.5);
            background: var(--bg-card-hover);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .contract-info {
            display: flex;
            align-items: baseline;
            gap: 6px;
        }

        .contract-name {
            font-size: 16px;
            font-weight: 700;
            color: var(--text-primary);
        }

        .contract-code {
            font-family: var(--font-mono);
            font-size: 11px;
            color: var(--text-muted);
        }

        .tag-physical {
            font-size: 9px;
            font-weight: 700;
            padding: 1px 4px;
            border-radius: 3px;
            background: #0d2136;
            border: 1px solid #1f6feb;
            color: #58a6ff;
            line-height: 1.2;
        }

        .tag-stale {
            font-size: 9px;
            font-weight: 700;
            padding: 1px 4px;
            border-radius: 3px;
            background: rgba(110, 131, 158, 0.15);
            border: 1px solid rgba(110, 131, 158, 0.35);
            color: #9cb1cc;
            line-height: 1.2;
        }

        .tag-night-active {
            font-size: 9px;
            font-weight: 700;
            padding: 1px 4px;
            border-radius: 3px;
            background: rgba(88, 166, 255, 0.15);
            border: 1px solid rgba(88, 166, 255, 0.4);
            color: #58a6ff;
            line-height: 1.2;
        }

        .header-pnl-group {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .change-badge {
            font-family: var(--font-mono);
            font-size: 13px;
            font-weight: 800;
            padding: 3px 8px;
            border-radius: 5px;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            letter-spacing: 0.2px;
        }

        .is-up-badge { background: var(--up-bg); color: var(--up-color); border: 1px solid rgba(248, 81, 73, 0.35); }
        .is-down-badge { background: var(--down-bg); color: var(--down-color); border: 1px solid rgba(46, 160, 67, 0.35); }
        .is-flat-badge { background: var(--flat-bg); color: var(--flat-color); border: 1px solid rgba(139, 157, 183, 0.2); }

        .star-btn {
            background: transparent;
            border: none;
            font-size: 17px;
            cursor: pointer;
            padding: 2px 4px;
            line-height: 1;
            transition: transform 0.15s ease;
        }
        .star-btn:hover { transform: scale(1.25); }
        .star-active { color: #f1c40f; text-shadow: 0 0 6px rgba(241, 196, 15, 0.6); }
        .star-inactive { color: #3b4b5e; }
        .star-inactive:hover { color: #8b9db7; }

        .hero-section {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            gap: 10px;
        }

        .latest-price {
            font-family: var(--font-mono);
            font-size: 28px;
            font-weight: 800;
            letter-spacing: -0.5px;
            line-height: 1;
        }

        .is-up { color: var(--up-color); }
        .is-down { color: var(--down-color); }
        .is-flat { color: var(--flat-color); }

        .price-diff-text {
            font-family: var(--font-mono);
            font-size: 12px;
            font-weight: 600;
        }

        .range-bar-wrapper {
            display: flex;
            flex-direction: column;
            gap: 3px;
        }

        .range-bar-labels {
            display: flex;
            justify-content: space-between;
            font-family: var(--font-mono);
            font-size: 10px;
            color: var(--text-muted);
        }

        .range-track {
            height: 4px;
            background: #1a2533;
            border-radius: 2px;
            position: relative;
        }

        .range-progress {
            position: absolute;
            height: 100%;
            left: 0;
            background: linear-gradient(90deg, #2ea043 0%, #d29922 50%, #f85149 100%);
            border-radius: 2px;
        }

        .range-point {
            position: absolute;
            top: -3px;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #ffffff;
            box-shadow: 0 0 4px rgba(0, 0, 0, 0.8);
            transform: translateX(-50%);
        }

        .details-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 3px 10px;
            background: #090e15;
            padding: 6px 10px;
            border-radius: 6px;
            font-size: 11px;
        }

        .detail-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .detail-label { color: var(--text-muted); }
        .detail-value { font-family: var(--font-mono); font-weight: 600; color: var(--text-secondary); }

        /* 专业图表弹出层 Modal */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.88);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 16px;
            overscroll-behavior: none;
            overscroll-behavior-x: none;
            overscroll-behavior-y: none;
            touch-action: none;
        }

        .modal-content {
            background: var(--bg-modal);
            border: 1px solid var(--border-highlight);
            border-radius: 12px;
            width: 100%;
            max-width: 1100px;
            height: 88vh;
            display: flex;
            flex-direction: column;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.9);
            overflow: hidden;
            position: relative;
            overscroll-behavior: none;
            overscroll-behavior-x: none;
            overscroll-behavior-y: none;
            touch-action: none;
        }

        .modal-loading-bar {
            position: absolute;
            top: 0;
            left: 0;
            height: 3px;
            width: 0%;
            background: linear-gradient(90deg, #388bfd, #58a6ff, #00f2fe);
            box-shadow: 0 0 8px #58a6ff;
            transition: width 0.2s ease, opacity 0.25s ease;
            z-index: 100;
            opacity: 0;
        }
        .modal-loading-bar.active { opacity: 1; width: 75%; }
        .modal-loading-bar.done { opacity: 1; width: 100%; }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 18px;
            background: #101824;
            border-bottom: 1px solid var(--border-color);
        }

        .modal-title-group {
            display: flex;
            align-items: baseline;
            gap: 12px;
            flex-wrap: wrap;
        }

        .modal-title { font-size: 18px; font-weight: 700; }
        .modal-price-hero { font-family: var(--font-mono); font-size: 22px; font-weight: 800; }

        .modal-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 18px;
            background: #090e15;
            border-bottom: 1px solid var(--border-color);
            flex-wrap: wrap;
            gap: 8px;
        }

        .modal-nav-left { display: flex; gap: 6px; }

        .chart-tab-btn {
            padding: 5px 12px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 600;
            background: #111a25;
            color: var(--text-secondary);
            border: 1px solid var(--border-color);
            cursor: pointer;
        }

        .chart-tab-btn.active {
            background: #1f6feb;
            color: #fff;
            border-color: #388bfd;
        }

        .modal-nav-status {
            font-family: var(--font-mono);
            font-size: 11px;
            color: #58a6ff;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .modal-body {
            flex: 1;
            position: relative;
            padding: 12px 18px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            overflow: hidden;
        }

        .chart-container {
            flex: 1;
            width: 100%;
            height: 100%;
            position: relative;
            min-height: 280px;
        }

        #pro-chart-canvas {
            width: 100%;
            height: 100%;
            display: block;
            cursor: crosshair;
            touch-action: none;
            overscroll-behavior: contain;
        }

        .chart-legend {
            display: flex;
            gap: 14px;
            font-family: var(--font-mono);
            font-size: 11px;
            color: var(--text-secondary);

    <script>
        // ==================== 品种与市场映射 (100% 真实物理合约) ====================
        // ⚠️ 东财 secid 命名规则（2026-10 实测，极易踩坑，勿凭直觉改）：
        //   113 上期所    代码小写 4 位   113.rb2612
        //   114 大商所    代码小写 4 位   114.i2701
        //   142 上期能源  代码小写 4 位   142.sc2611   ← 不是 113
        //   115 郑商所    代码大写 3 位   115.MA701    ← YMM 而非 YYMM，小写无效
        //   220 中金所    代码大写 4 位   220.IF2703   ← 不是 8
        //   225 广期所    代码小写 4 位   225.si2611
        // 写成 113.2612（丢字母）、115.MA2611（4位）、8.IF2703 都会 data:null 或断连，
        // 曾因此误判为「休市无数据」。
        const VARIETY_MARKET = {
            'M': 114, 'JM': 114, 'J': 114, 'I': 114, 'Y': 114, 'P': 114, 'C': 114, 'CS': 114,
            'A': 114, 'B': 114, 'L': 114, 'V': 114, 'PP': 114, 'EG': 114, 'EB': 114, 'PG': 114,
            'LH': 114, 'JD': 114, 'RR': 114, 'FB': 114, 'BB': 114,
            'RB': 113, 'HC': 113, 'AG': 113, 'AU': 113, 'CU': 113, 'AL': 113, 'ZN': 113, 'PB': 113,
            'NI': 113, 'SN': 113, 'SS': 113, 'FU': 113, 'BU': 113, 'RU': 113, 'SP': 113, 'AO': 113,
            'BR': 113, 'WR': 113,
            'SC': 142, 'LU': 142, 'NR': 142, 'BC': 142, 'EC': 142,
            'OI': 115, 'TA': 115, 'MA': 115, 'FG': 115, 'SA': 115, 'RM': 115, 'RS': 115, 'SR': 115,
            'CF': 115, 'CY': 115, 'AP': 115, 'CJ': 115, 'UR': 115, 'PF': 115, 'PK': 115, 'PX': 115,
            'SH': 115, 'ZC': 115, 'SF': 115, 'SM': 115,
            'IF': 220, 'IC': 220, 'IM': 220, 'IH': 220, 'TF': 220, 'T': 220, 'TS': 220, 'TL': 220,
            'SI': 225, 'LC': 225, 'PS': 225
        };

        // 按交易所规则拼出东财合约代码（不含 market 前缀）
        function makeContractCode(symbol, year, month) {
            const market = VARIETY_MARKET[symbol] || 114;
            const mm = (month < 10 ? '0' + month : '' + month);
            if (market === 115) return symbol + (year % 10) + mm;      // 郑商所 3 位 YMM，大写
            if (market === 220) return symbol.toUpperCase() + String(year % 100).padStart(2, '0') + mm;
            return symbol.toLowerCase() + String(year % 100).padStart(2, '0') + mm;
        }

        // 把 "rb2612" / "MA701" / "113.rb2612" 统一解析成 secid
        function secidOf(rawCode) {
            if (!rawCode) return null;
            const code = ('' + rawCode).trim();
            if (code.includes('.')) return code;
            const m = code.toUpperCase().match(/^([A-Z]+)(\d{3,4})$/);
            if (!m) return null;
            const symbol = m[1], digits = m[2];
            const market = VARIETY_MARKET[symbol] || 114;
            let eastCode;
            if (market === 115 && digits.length === 4) {
                // 郑商所：东财用 3 位，2026-10 → 610（去掉百位年）
                eastCode = symbol + digits.slice(1);
            } else if (market === 220) {
                eastCode = symbol.toUpperCase() + digits;
            } else {
                eastCode = symbol.toLowerCase() + digits;
            }
            return market + '.' + eastCode;
        }

        // 全市场合约池：不做任何"列表接口"依赖，靠品种表 + 月份枚举自建
        // 排列刻意做成「按月份交错、每月跨交易所」：某一批 150 个请求失败时，
        // 丢的是"各品种的某两个月份"，而不是"整个郑商所"，列表不会整片消失。
        const POOL_MONTHS_AHEAD = 8;
        const SINA_POOL_MONTHS = 2;   // 新浪兜底只扫未来 2 个月，控制逐合约请求量（约 100+ 合约）
        let cachedPool = null;
        let cachedPoolKey = '';
        function buildContractPool(months) {
            months = months || POOL_MONTHS_AHEAD;
            const now = new Date();
            const key = now.getFullYear() + '-' + (now.getMonth() + 1) + '-' + months;
            if (cachedPool && cachedPoolKey === key) return cachedPool;
            const out = [];
            const symbols = Object.keys(VARIETY_MARKET);
            for (let i = 1; i <= months; i++) {
                const d = new Date(now.getFullYear(), now.getMonth() + i, 1);
                for (const symbol of symbols) {
                    const market = VARIETY_MARKET[symbol];
                    const code = makeContractCode(symbol, d.getFullYear(), d.getMonth() + 1);
                    out.push({ secid: market + '.' + code, code: code, market: market, symbol: symbol });
                }
            }
            cachedPool = out;
            cachedPoolKey = key;
            return out;
        }

        // 解析合约的具体交割年份与月份
        function parseContractYearMonth(name, code) {
            const str = `${code || ''} ${name || ''}`.toUpperCase();
            // 1. 优先匹配 4 位年份月份 (如 2610 -> 2026年10月, 2505 -> 2025年5月, 2701 -> 2027年1月)
            const m4 = str.match(/(\d{2})(\d{2})/);
            if (m4) {
                const y = 2000 + parseInt(m4[1]);
                const m = parseInt(m4[2]);
                if (m >= 1 && m <= 12) return { year: y, month: m };
            }
            // 2. 匹配郑商所等 3 位年份月份 (如 610 -> 2026年10月, 603 -> 2026年3月, 705 -> 2027年5月)
            const m3 = str.match(/(\d)(\d{2})/);
            if (m3) {
                const y = 2020 + parseInt(m3[1]);
                const m = parseInt(m3[2]);
                if (m >= 1 && m <= 12) return { year: y, month: m };
            }
            return null;
        }

        // 判断是否为近月/已过期的无参与价值合约
        // 规则：
        // (a) 当月合约及历史已过期月份 100% 排除 (如当前为 10 月，排除所有 10 月及之前合约)
        // (b) 下个月合约：若当前已达月中/下旬 (每月 16 日起)，下月合约因临近交割亦无参与价值，予以排除
        function isNearOrExpiredContract(name, code) {
            const ym = parseContractYearMonth(name, code);
            if (!ym) return true; // 无法识别交割年月的一律排除

            const now = new Date();
            const curYear = now.getFullYear();
            const curMonth = now.getMonth() + 1; // 1 - 12
            const curDay = now.getDate();        // 1 - 31

            const contractScore = ym.year * 12 + ym.month;
            const curScore = curYear * 12 + curMonth;

            // (a) 当月及历史过期月份：坚决过滤
            if (contractScore <= curScore) return true;

            // (b) 下个月合约：每月 16 日起排除 (临近交割仅剩约 15 天)
            if (contractScore === curScore + 1 && curDay >= 16) return true;

            return false;
        }

        // 判断是否为真实交割合约 (必须包含具体年月数字，且绝对不含主连/指数/近月交割月)
        function isPhysicalContract(name, code) {
            if (!name || !code) return false;
            
            // 1. 绝对剔除合成虚拟标的
            const syntheticKeywords = ['主连', '次主连', '主力', '连续', '加权', '指数', '当月', '下月', '下季', '隔季', '月均'];
            if (syntheticKeywords.some(kw => name.includes(kw))) return false;
            if (code.endsWith('m') || code.endsWith('M')) return false;

            // 2. 必须包含 3 位或 4 位数字交割月份 (如 2610, 2701, 610, 505)
            const hasDigits = /\d{3,4}/.test(code) || /\d{3,4}/.test(name);
            if (!hasDigits) return false;

            // 3. 近月与过期合约过滤：散户无交割价值，当月及月中后的次月合约 100% 排除
            if (isNearOrExpiredContract(name, code)) return false;

            return true;
        }

        function resolveSecId(input) {
            if (!input) return null;
            const secid = secidOf(input);
            if (!secid) return null;
            const code = secid.split('.')[1];
            return { rawInput: ('' + input).trim().toUpperCase(), secid: secid, symbol: code.toUpperCase() };
        }

        // ==================== 品种聚合与领头月份提取 ====================
        function parseVarietySymbol(code) {
            if (!code) return '';
            const m = String(code).trim().match(/^([A-Za-z]+)/);
            return m ? m[1].toLowerCase() : '';
        }

        function parseMonthCode(code) {
            if (!code) return '';
            const m = String(code).trim().match(/^[A-Za-z]+(\d+)/);
            return m ? m[1] : '';
        }

        // 按品种对异动合约进行聚合收拢 (同一品种仅出一张代表卡片，附带活跃月份列表)
        function groupQuotesByVariety(quotes) {
            if (!Array.isArray(quotes) || quotes.length === 0) return [];

            const map = new Map();

            quotes.forEach(q => {
                const sym = parseVarietySymbol(q.code);
                if (!sym) return;

                if (!map.has(sym)) {
                    // 提取基础品种名 (例如 "碳酸锂2705" -> "碳酸锂", "螺纹2612" -> "螺纹")
                    const baseName = (q.name || '').replace(/\d+$/, '').trim() || sym.toUpperCase();
                    map.set(sym, {
                        variety: sym,
                        name: baseName,
                        market: q.market,
                        months: []
                    });
                }

                const group = map.get(sym);
                const monthCode = parseMonthCode(q.code);
                group.months.push({
                    ...q,
                    monthCode: monthCode
                });
            });

            const groups = [];
            map.forEach(group => {
                if (!group.months.length) return;

                // 寻找 |涨跌幅| 最大的作为领头合约 (Lead)
                let lead = group.months[0];
                group.months.forEach(m => {
                    if (Math.abs(m.changePercent) > Math.abs(lead.changePercent)) {
                        lead = m;
                    }
                });

                // 按成交量倒序排序（成交量最大即主力合约排在首位，平局时按代码排序），并标记 isLead
                group.months.sort((a, b) => ((b.vol || 0) - (a.vol || 0)) || a.code.localeCompare(b.code));
                group.months.forEach((m, idx) => {
                    m.isLead = (m.secid === lead.secid);
                    m.isDominant = (idx === 0);
                });

                group.leadQuote = lead;
                group.activeSecid = lead.secid;
                groups.push(group);
            });

            // 各品种按领头合约的 |涨跌幅| 倒序排列
            groups.sort((a, b) => Math.abs(b.leadQuote.changePercent) - Math.abs(a.leadQuote.changePercent));
            return groups;
        }

        // ==================== 应用状态 ====================
        const DEFAULT_WATCHLIST = ['rb2612', 'fu2612', 'i2701', 'ag2612', 'v2701', 'pp2701'];
        const STORAGE_KEY = 'mystx_futures_physical_v3';

        // ==================== 自选与运行态行情管理 ====================
        // 行情数据仅在 JS 内存运行态管理，绝不存入 localStorage，每次打开均 100% 实时从市场并发拉取
        let cloudWatchAvailable = false; // 是否已与 Cloudflare KV 全局云端自选打通
        let lastGoodQuotes = [];
        let lastGoodTs = 0;
        let dataMode = 'init'; // 'init' | 'live' | 'cache' | 'empty'
        let quoteSource = 'ulist'; // 'ulist' | 'clist' | 'sina'（数据源标记，用于横幅提示）

        // ==================== 交易时段 & 刷新节奏（真话版） ====================
        // 设计原则（2026-10 重构）：
        //   1. 全部数据来自 ulist 批量接口，它在休市时仍返回「最近交易时段收盘」，不需要云端快照搬运。
        //   2. 休市期间**一个请求都不发**，只挂一个一次性定时器到「下一开盘前 10 分钟」（08:50 / 13:20 / 20:50）。
        //   3. 不再有 60s/300s 的假刷新——没有新数据时刷新只是白白空转。
        const DAY_SESSIONS = [[9 * 60, 11 * 60 + 30], [13 * 60 + 30, 15 * 60]];
        const NIGHT_SESSIONS = [[21 * 60, 24 * 60], [0, 2 * 60 + 30]];
        const OPEN_TIMES = [9 * 60, 13 * 60 + 30, 21 * 60];   // 日盘开盘 / 午盘开盘 / 夜盘开盘
        const PRE_OPEN_LEAD_MIN = 10;                          // 开盘前提前量 → 08:50 / 13:20 / 20:50

        function minutesOfDay(d) { return d.getHours() * 60 + d.getMinutes(); }

        function isTradingNow(date) {
            const t = minutesOfDay(date || new Date());
            return DAY_SESSIONS.some(r => t >= r[0] && t <= r[1])
                || NIGHT_SESSIONS.some(r => t >= r[0] && t <= r[1]);
        }

        // 兼容旧调用点：休市 = 不交易
        function isMarketOffHours() { return !isTradingNow(); }

        // 是否处于「开盘前 10 分钟」窗口（08:50-09:00 / 13:20-13:30 / 20:50-21:00）
        // 窗口内虽有收盘快照，但要拉一次最新盘前数据，不能拿旧收盘快照糊弄
        function inPreOpenWindow() {
            const t = minutesOfDay(new Date());
            return OPEN_TIMES.some(o => t >= o - PRE_OPEN_LEAD_MIN && t < o);
        }

        function marketPhaseLabel() {
            const t = minutesOfDay(new Date());
            if (DAY_SESSIONS.some(r => t >= r[0] && t <= r[1])) return '盘中';
            if (NIGHT_SESSIONS.some(r => t >= r[0] && t <= r[1])) return '夜盘';
            return '休市';
        }

        // 下一个该刷新的时刻：交易中 → null（走常规轮询）；休市 → 下一个开盘前 10 分钟
        function nextRefreshAt(from) {
            const base = from ? new Date(from.getTime()) : new Date();
            if (isTradingNow(base)) return null;
            for (let dayOffset = 0; dayOffset <= 3; dayOffset++) {
                for (const openMin of OPEN_TIMES) {
                    const target = new Date(base.getTime());
                    target.setDate(target.getDate() + dayOffset);
                    target.setHours(0, 0, 0, 0);
                    target.setMinutes(openMin - PRE_OPEN_LEAD_MIN);
                    if (target.getTime() > base.getTime() + 30000) return target;
                }
            }
            return null;
        }

        function fmtHM(d) {
            const p = n => (n < 10 ? '0' + n : '' + n);
            return p(d.getHours()) + ':' + p(d.getMinutes());
        }

        // 休市时给人看的说明：下次几时刷新 + 还差多久
        function idleHintText() {
            const t = nextRefreshAt();
            if (!t) return '';
            const now = new Date();
            let mins = Math.round((t.getTime() - now.getTime()) / 60000);
            const sameDay = t.getDate() === now.getDate() && t.getMonth() === now.getMonth();
            const dayTag = sameDay ? '' : (t.getDate() === now.getDate() + 1 ? '明日 ' : (t.getMonth() + 1) + '/' + t.getDate() + ' ');
            let eta = '';
            if (mins >= 60) eta = Math.floor(mins / 60) + ' 小时 ' + (mins % 60) + ' 分';
            else eta = mins + ' 分';
            return dayTag + fmtHM(t) + ' 自动刷新（还有 ' + eta + '）';
        }

        // ==================== 交易时段感知与时效性过滤 (过滤日盘死数据) ====================
        // 格式化成交时间
        function formatTradeTime(ts) {
            if (!ts) return '--';
            const d = new Date(ts);
            const p = n => (n < 10 ? '0' + n : '' + n);
            return `${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`;
        }

        // 交易所官方统一夜盘品种清单 (各大期货交易所官方明确开设夜盘交易的品种，共 50 个)
        // 凡不在该集合中的品种（如红枣 CJ、苹果 AP、花生 PK、尿素 UR、生猪 LH、鸡蛋 JD、碳酸锂 LC、工业硅 SI、欧线 EC 等 25 个品种），交易所一律无夜盘！
        const NIGHT_TRADING_SYMBOLS = new Set([
            'm', 'jm', 'j', 'i', 'y', 'p', 'c', 'cs', 'a', 'b', 'l', 'v', 'pp', 'eg', 'eb', 'pg',
            'rb', 'hc', 'ag', 'au', 'cu', 'al', 'zn', 'pb', 'ni', 'sn', 'ss', 'fu', 'bu', 'ru', 'sp', 'ao', 'br',
            'sc', 'lu', 'nr', 'bc',
            'oi', 'ta', 'ma', 'fg', 'sa', 'rm', 'sr', 'cf', 'cy', 'pf', 'px', 'sh', 'zc'
        ]);

        function hasNightTrading(code) {
            const sym = parseVarietySymbol(code);
            return NIGHT_TRADING_SYMBOLS.has(sym);
        }

        // 当前是否处于夜盘交易窗口或夜盘收盘后到次日早盘前窗口 (21:00 至 次日 08:50，以及周末全天)
        // 在此窗口内，市场最新发生的交易是夜盘，无夜盘品种处于日盘定格状态
        function isNightSessionWindow(date) {
            const d = date || new Date();
            const day = d.getDay(); // 0: 日, 6: 六
            const t = minutesOfDay(d);
            if (day === 6 || day === 0) return true; // 周末市场最新发生的是周五夜盘
            if (day === 1 && t < 8 * 60 + 50) return true; // 周一早盘前
            return (t >= 21 * 60 || t < 8 * 60 + 50);
        }

        // 获取当前所属夜盘的起始时间戳 (例如当晚 21:00，跨日凌晨/清晨则取前一自然日 21:00，周一清晨取周五 21:00)
        function getNightSessionStartTime(refDate) {
            const d = new Date(refDate || Date.now());
            const day = d.getDay(); // 0: 日, 1: 一, ..., 6: 六
            const hour = d.getHours();
            const start = new Date(d);

            if (day === 1 && hour < 12) {
                // 周一早盘前：上一个夜盘是上周五 21:00
                start.setDate(start.getDate() - 3);
            } else if (day === 0) {
                // 周日：上一个夜盘是周五 21:00
                start.setDate(start.getDate() - 2);
            } else if (hour < 12) {
                // 周二至周六凌晨/清晨：始于前一日 21:00
                start.setDate(start.getDate() - 1);
            }
            start.setHours(21, 0, 0, 0);
            return start.getTime();
        }

        // 获取交易时段详细状态
        function getMarketSessionStatus(date) {
            const d = date || new Date();
            const t = minutesOfDay(d);
            const isNight = NIGHT_SESSIONS.some(r => t >= r[0] && t <= r[1]);
            const isDay = DAY_SESSIONS.some(r => t >= r[0] && t <= r[1]);
            return {
                isTrading: isNight || isDay,
                isNight: isNight,
                isDay: isDay,
                phase: isNight ? '夜盘' : (isDay ? '盘中' : '休市')
            };
        }

        // 判断合约在当前交易时段是否为真实活跃撮合（解决红枣CJ、苹果AP、碳酸锂LC等无夜盘品种日盘停滞数据污染夜盘异动榜的问题）
        function isQuoteActiveInCurrentSession(quote, refDate) {
            if (!quote) return false;
            const now = refDate || new Date();
            if (isNightSessionWindow(now)) {
                // 1. 交易所硬规则：品种必须具备夜盘资格 (红枣 CJ、苹果 AP、生猪 LH、鸡蛋 JD、碳酸锂 LC、工业硅 SI、欧线 EC 等 100% 隔离)
                if (!hasNightTrading(quote.code || quote.secid)) return false;

                // 2. 有夜盘品种：检查实际成交时间戳是否处于今晚夜盘中 (杜绝未开盘夜盘品种的日盘旧数据)
                // 注意：东财服务器会在 21:00:00 广播一次盘前状态戳，因此真实夜盘成交时间必须严格大于 21:00:00
                if (!quote.tradeTime) return true;
                const nightStart = getNightSessionStartTime(now);
                return quote.tradeTime > nightStart;
            }
            // 日盘交易时段 (09:00 - 15:00) 及 日盘收盘后 (15:00 - 21:00)：全市场均已参与日盘，均为有效数据
            return true;
        }

        // 说明：原「云端收盘快照」机制已整体移除。
        // 原因是快照要跨设备搬运，多端谁写谁读、以谁为准都很难自洽；
        // 而 ulist 批量接口本身在休市时就能返回最近交易时段收盘，直接读即可，无需搬运。

        // ==================== 全局自选云同步 (Cloudflare KV 全局共用) ====================
        // 从 Cloudflare KV 读取全局自选（手机电脑共用同一份自选，零登录零口令）
        async function fetchGlobalWatchlist() {
            try {
                const resp = await fetch('/api/watchlist', { cache: 'no-store' });
                if (!resp.ok) throw new Error('status: ' + resp.status);
                const json = await resp.json();
                if (json && json.ok) {
                    if (Array.isArray(json.list) && json.list.length > 0) {
                        // 云端已有自选：以云端最新列表为准，同步写入本地缓存
                        customWatchlist = json.list;
                        try { localStorage.setItem(STORAGE_KEY, JSON.stringify(customWatchlist)); } catch (e) {}
                        cloudWatchAvailable = true;
                        if (currentMode === 'custom' && isStep1Ready) {
                            filterAndRenderFocusPool();
                        }
                    } else if (customWatchlist.length > 0) {
                        // 云端尚为空：自动将本地当前的自选同步至云端，完成首期播种
                        saveWatchlistToCloud();
                        cloudWatchAvailable = true;
                    }
                }
            } catch (e) {
                console.warn('[watchlist] 全局自选同步暂不可用:', e);
                cloudWatchAvailable = false;
            }
            updateDataSourceBanner();
        }

        // 推送当前自选列表至 Cloudflare KV
        async function saveWatchlistToCloud() {
            try {
                const resp = await fetch('/api/watchlist', {
                    method: 'POST',
                    headers: { 'content-type': 'application/json' },
                    body: JSON.stringify({ list: customWatchlist })
                });
                const json = await resp.json();
                cloudWatchAvailable = !!(json && json.ok);
            } catch (e) {
                console.warn('[watchlist] 推送云端失败:', e);
                cloudWatchAvailable = false;
            }
            updateDataSourceBanner();
        }

        function updateDataSourceBanner() {
            const el = document.getElementById('data-source-banner');
            if (!el) return;
            const phase = marketPhaseLabel();
            let html = '';
            if (dataMode === 'live') {
                if (phase === '休市') {
                    const t = lastGoodTs ? new Date(lastGoodTs).toTimeString().split(' ')[0] : '--';
                    html += '🌙 休市 · 最近交易时段收盘 · 抓取于 ' + t + ' · ' + allPhysicalQuotes.length + ' 个合约';
                } else {
                    html += '🟢 ' + phase + '实时 · ' + allPhysicalQuotes.length + ' 个合约 · 更新于 '
                        + (lastGoodTs ? new Date(lastGoodTs).toTimeString().split(' ')[0] : '--');
                }
                html += ' · 源:' + (quoteSource === 'snapshot' ? '收盘快照(定时)' : (quoteSource === 'sina' ? '新浪日线(精选' + SINA_POOL_MONTHS + '月)' : (quoteSource === 'ulist' ? '东财(批量)' : '东财')));
            } else if (dataMode === 'cache') {
                const t = lastGoodTs ? new Date(lastGoodTs).toTimeString().split(' ')[0] : '未知';
                html += '🟡 本次未取到数据，显示本机缓存（截至 ' + t + '）';
            } else if (dataMode === 'empty') {
                html += '⚠️ 未取到任何行情（批次 ' + lastBatchStat.okBatches + '/' + lastBatchStat.batches
                    + ' 成功' + (lastBatchStat.lastErr ? ' · ' + lastBatchStat.lastErr : '') + '）· 点「手动刷新」重试';
            } else {
                html += '⏳ 初始化中…';
            }
            if (!isTradingNow()) {
                const hint = idleHintText();
                if (hint) html += ' · ' + hint;
            }
            if (cloudWatchAvailable) {
                html += ' · ☁️ 自选: 全局云端同步';
            } else {
                html += ' · 💾 自选: 本地存储';
            }
            el.innerHTML = html;
        }

        let customWatchlist = [];
        let currentMode = 'abs';
        let currentThreshold = 1.0;
        let currentVolThreshold = 10000; // 默认成交量硬门槛：10000手 (主力)
        let scanIntervalSec = 100;       // 第1级全盘重扫周期 (100秒)
        let focusPollSec = 5;            // 第2级焦点高频轮询 (5秒)
        let countdownRemaining = 100;

        let isStep1Ready = false;        // 第1步完成标志
        let isScanning = false;          // 第1步扫描锁

        let allPhysicalQuotes = [];      // 第1步全市场筛选池
        let focusQuotes = [];            // 第2步高频轮询焦点池

        let focusPollTimer = null;       // 第2级高频轻量定时器
        let countdownTimer = null;       // 1秒倒计时时钟

        // 弹窗状态 (无发霉缓存，即点即查)
        // 弹窗状态 (无发霉缓存，即点即查)
        let activeModalSecId = null;
        let activeModalQuote = null;
        let currentChartType = '15';
        let chartReqVersion = 0;         // 请求版本防竞争锁
        let currentWheelAction = localStorage.getItem('mystx_wheel_action') || 'zoom';
        let cachedFullKlines = [];       // 缓存当前合约拉取到的完整历史 K 线
        let chartViewStart = 0;           // 平移偏移：从最新一根往前回溯的 K 柱数（触控拖动 / 单指滑动用）
        let currentVisibleCount = 150;   // 当前视口缩放展现的 K 柱数量
        let lastWheelSwitchTime = 0;     // 滚轮切合约防抖时间戳

        // 初始化
        function init() {
            initPwaHistoryGuard();

            // 初始化滚轮偏好选择器
            const wheelSel = document.getElementById('wheel-action-select');
            if (wheelSel) wheelSel.value = currentWheelAction;

            // 监听弹窗滚轮事件 (严格拦截，100% 阻止底层页面滚动)
            const modalEl = document.getElementById('chart-modal');
            if (modalEl) {
                modalEl.addEventListener('wheel', handleModalWheel, { passive: false });
            }

            // 全局键盘快捷键 (Esc关闭, ↑/↓/PgUp/PgDn切合约, +-缩放)
            window.addEventListener('keydown', handleModalKeyDown);

            window.addEventListener('resize', () => {
                renderProgressNodes();

                    else redrawKlineCanvasOnly();

            // 智能休眠机制
            document.addEventListener('visibilitychange', () => {

                    fetchGlobalWatchlist();

            });

            // 严格纯净：主动清除可能遗留的历史行情本地存储键（仅自选保留在 localStorage）
            try {
                localStorage.removeItem('mystx_futures_cache_v2');
                localStorage.removeItem('mystx_futures_cache_ts');
            } catch (e) {}

            initWatchlist();              // 先读本地秒开，并异步连通全局 KV 同步
            initTabSwipeGesture();        // 启用手机端双 Tab 左右滑动手势切换
            renderProgressNodes();
            scanFullMarket(false);        // 100% 直连市场实时并发拉取
        }

        // 初始化自选：本地瞬时加载 + 异步连通全局 KV
        function initWatchlist() {
            const saved = localStorage.getItem(STORAGE_KEY);
            if (saved) {
                try {
                    const parsed = JSON.parse(saved);
                    if (Array.isArray(parsed) && parsed.length) customWatchlist = parsed;
                    else customWatchlist = [...DEFAULT_WATCHLIST];
                } catch(e) { customWatchlist = [...DEFAULT_WATCHLIST]; }
            } else {
                customWatchlist = [...DEFAULT_WATCHLIST];
            }
            updateDataSourceBanner();
            fetchGlobalWatchlist();
        }

        function saveWatchlist() {
            try { localStorage.setItem(STORAGE_KEY, JSON.stringify(customWatchlist)); } catch (e) {}
            saveWatchlistToCloud();
        }

        // ==================== 设置抽屉切换与外部点击收起 ====================
        function toggleSettingsDrawer() {
            const drawer = document.getElementById('settings-drawer');

        // ==================== 手机端双 Tab 左右滑动手势切换 ====================
        function initTabSwipeGesture() {

            let isSwiping = false;

            document.addEventListener('touchstart', (e) => {
                if (activeModalSecId) return; // 二级图表面板打开时严格禁用，确保 K 线手势独立

                if (modal && modal.style.display === 'flex') return;
                const drawer = document.getElementById('settings-drawer');
                if (drawer && drawer.style.display !== 'none') return; // 设置抽屉展开时禁用

                // 避开屏幕左右两端 24px 边缘区域，杜绝与系统级侧滑返回手势冲突
                if (!e.touches || e.touches.length !== 1) return;
                const touchX = e.touches[0].clientX;
                if (touchX < 24 || touchX > window.innerWidth - 24) return;

                startX = touchX;
                startY = e.touches[0].clientY;
                isSwiping = true;
            }, { passive: true });

            document.addEventListener('touchend', (e) => {
                if (!isSwiping || activeModalSecId) return;
                isSwiping = false;
                if (!e.changedTouches || e.changedTouches.length === 0) return;

                const deltaX = e.changedTouches[0].clientX - startX;
                const deltaY = e.changedTouches[0].clientY - startY;

                // 判定：水平滑动距离 > 50px，且水平偏角明显大于垂直移动 (1.5倍)，避免干扰常规上下翻看行情
                if (Math.abs(deltaX) > 50 && Math.abs(deltaX) > Math.abs(deltaY) * 1.5) {
                    if (deltaX < 0) {
                        // 手指向左滑：切换到下一个 Tab (异动榜 -> 我的自选)
                        switchMode(currentMode === 'abs' ? 'custom' : 'abs');
                    } else {
                        // 手指向右滑：切换到上一个 Tab (我的自选 -> 异动榜)
                        switchMode(currentMode === 'custom' ? 'abs' : 'custom');
                    }
                }
            }, { passive: true });
        }

        function setThreshold(val) {
            currentThreshold = val;
            document.querySelectorAll('.threshold-chip').forEach(c => {
                c.classList.toggle('active', parseFloat(c.textContent) === val);

            const tabAbs = document.getElementById('tab-abs');

            // 核心修复：切换涨跌幅门槛时，与成交量门槛完全一致，立即发起一次全市场第1级重扫并重置倒计时
            scanFullMarket(false);
        }

        // ==================== 绘制打点节点与吃豆抹掉机制 (0% CPU 占用) ====================
        function renderProgressNodes() {
            const layer = document.getElementById('progress-nodes-layer');
            if (!layer) return;
            layer.innerHTML = '';

            if (scanIntervalSec <= 0 || focusPollSec <= 0) return;

            const totalNodes = Math.floor(scanIntervalSec / focusPollSec);
            if (totalNodes <= 0 || totalNodes > 60) return;

            for (let i = 1; i < totalNodes; i++) {
                const pct = (i * focusPollSec / scanIntervalSec) * 100;
                const pin = document.createElement('div');
                pin.className = 'progress-node-pin active';

        // 触发第 2 级刷新时的吃豆反馈 (0% CPU)
        function triggerLevel2PulseAnimation(elapsed) {
            const badge = document.getElementById('level2-pulse-badge');
            if (badge) {
